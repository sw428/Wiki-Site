<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296.4" viewBox="0 715 1000 390" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">親のborder-topが親子の上marginの相殺を防ぐ</title>
<desc id="desc">通常フローのブロック配置で、前の要素にはmarginがない例。親のmargin-top: 20px、border-top: 2px、最初の子のmargin-top: 40pxを示す。親の上borderが親子のmarginを隔てるため相殺せず、前の要素の下端から子の上端まで20pxと2pxと40pxを加えた62pxになる。黄色の帯だけが実際のCSSのborderを表す。灰色の実線は親の範囲を示す補助線。オレンジはmarginの説明用の色で、寸法と配置は模式的に示す。</desc>
<rect x="0" y="764" width="1000" height="341" fill="#FFFFFF"/>
<rect x="26" y="778" width="948" height="313" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
<rect x="26" y="778" width="948" height="52" rx="16" fill="#FFF5EB"/>
<rect x="26" y="818" width="948" height="12" rx="0" fill="#FFF5EB"/>
<text x="49" y="812" font-family="'Noto Sans CJK JP', sans-serif" font-size="23" font-weight="700" fill="#000000">③ border-top: 2px を追加</text>
<rect x="835" y="788" width="116" height="33" rx="16" fill="#FFFFFF" stroke="#BFD3E5" stroke-width="1"/>
<text style="fill:#000000" x="893" y="811" font-family="'Noto Sans CJK JP', sans-serif" font-size="16" fill="#000000" font-weight="700" text-anchor="middle">相殺しない</text>
<rect x="73" y="843" width="420" height="43" rx="4" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.3"/>
<text x="283" y="871" font-family="'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#315fa0">前の要素（margin: 0）</text>
<rect x="73" y="886" width="420" height="25" rx="0" fill="#f9cc9d"/>
<text x="283" y="902" font-family="'Noto Sans CJK JP', sans-serif" font-size="14" font-weight="700" text-anchor="middle" style="fill:#444444" fill="#444444">親margin：20px</text>
<rect x="73" y="911" width="420" height="166" rx="0" fill="#f5f5f5"/>
<rect x="73" y="911" width="420" height="5" rx="0" fill="#f2ed20"/>
<rect x="73" y="914" width="420" height="50" rx="0" fill="#f9cc9d"/>
<text x="283" y="944" font-family="'Noto Sans CJK JP', sans-serif" font-size="18" font-weight="700" text-anchor="middle" style="fill:#c93030" fill="#c93030">子margin：40px</text>
<rect x="73" y="964" width="420" height="48" rx="0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.3"/>
<text x="283" y="995" font-family="'Noto Sans CJK JP', sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#c93030">子要素</text>
<text x="283" y="1065" font-family="'Noto Sans CJK JP', sans-serif" font-size="16" fill="#444444" font-weight="700" text-anchor="middle">親要素</text>
<line x1="70.35" y1="908.35" x2="495.65" y2="908.35" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.65" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<rect x="73" y="911" width="420" height="5" rx="0" fill="#f2ed20"/>
<line x1="70.35" y1="908.35" x2="70.35" y2="1079.65" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.65" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<line x1="495.65" y1="908.35" x2="495.65" y2="1079.65" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.65" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<line x1="70.35" y1="1079.65" x2="495.65" y2="1079.65" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.65" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<text x="71" y="898" font-family="'Noto Sans CJK JP', sans-serif" font-size="14" fill="#444444" font-weight="700">親の上端</text>
<rect x="521" y="840" width="435" height="135" rx="10" fill="#F4F6F8" stroke="#DCE2E9" stroke-width="1.2"/>
<text x="540" y="871" font-family="'Noto Sans Mono CJK JP', monospace" font-size="18" fill="#000000">.parent { margin-top: 20px;</text>
<text x="540" y="898" font-family="'Noto Sans Mono CJK JP', monospace" font-size="18" fill="#000000">          border-top: 2px solid #f2ed20; }</text>
<text x="540" y="925" font-family="'Noto Sans Mono CJK JP', monospace" font-size="18" fill="#000000">.child  { margin-top: 40px; }</text>
<text style="fill:#000000" x="521" y="1001" font-family="'Noto Sans CJK JP', sans-serif" font-size="18" fill="#000000">前の要素 → 子要素の上端：</text>
<text x="521" y="1033" font-family="'Noto Sans CJK JP', sans-serif" font-size="19" fill="#000000" font-weight="700" style="fill:#000000">20px + 2px + 40px = 62px</text>
<text style="fill:#000000" x="521" y="1064" font-family="'Noto Sans CJK JP', sans-serif" font-size="15" fill="#000000">borderが間に入るため、親子のmarginは相殺しない。</text>
<g id="parent-boundary-note"><rect x="0" y="715" width="1000" height="49" fill="#ffffff"/><text x="986" y="733.2" text-anchor="end" style="fill:#444444;font-family:Yu Gothic,Meiryo,sans-serif;font-size:14px;font-weight:400"><tspan x="986">※ 灰色の線はborderではなく、</tspan><tspan x="986" dy="21">親の範囲を示す補助線です。</tspan></text></g></svg>
