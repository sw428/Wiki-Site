<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">PCとSPを、それぞれ100%の幅で比べる</title><desc id="desc">同じ長さの帯を、それぞれの親の内容幅100%として比較。PCは32%の列3本と2%のgap2箇所、SPは47%の列2本と6%のgap1箇所。実際の画面幅の比較ではない。</desc><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#000000}.heading{font-size:25px;font-weight:700}.body{font-size:21px}.sub{font-size:19px}.note{font-size:14px}.column{font-size:23px;fill:#007F99}.gap{font-size:20px;fill:#7C3AED}.parent{font-size:20px;fill:#444444}.math{font-size:23px}.label{font-size:22px;font-weight:700}</style><rect width="760" height="510" fill="#ffffff"/><text x="32" y="42" class="heading" text-anchor="start">PCとSPを、それぞれ100%の幅で比べる</text><text x="728" y="72" class="note" text-anchor="end">※ 灰色の線はborderではなく、親の範囲を示す補助線です。</text><text x="70" y="116" class="label" text-anchor="start">PC：3列 → 間隔は2箇所</text><g class="band" data-n="3" data-gap="2" data-column="32" data-width="620"><rect x="68" y="136" width="624" height="62" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><rect class="track" data-start="70" data-width="198.4" x="71" y="139" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="169.2" y="175" class="column" text-anchor="middle">32%</text><rect class="gutter" x="268.4" y="138" width="12.4" height="58" fill="#ECE5FF" stroke="none"/><path d="M 274.59999999999997 199 v 14" stroke="#7C3AED" fill="none"/><text x="274.59999999999997" y="238" class="gap" text-anchor="middle">2%</text><rect class="track" data-start="280.8" data-width="198.4" x="281.8" y="139" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="380" y="175" class="column" text-anchor="middle">32%</text><rect class="gutter" x="479.20000000000005" y="138" width="12.4" height="58" fill="#ECE5FF" stroke="none"/><path d="M 485.40000000000003 199 v 14" stroke="#7C3AED" fill="none"/><text x="485.40000000000003" y="238" class="gap" text-anchor="middle">2%</text><rect class="track" data-start="491.6" data-width="198.4" x="492.6" y="139" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="590.8000000000001" y="175" class="column" text-anchor="middle">32%</text></g><text x="380" y="274" class="math" text-anchor="middle">32 × 3 ＋ 2 × 2 ＝ 100%</text><text x="70" y="319" class="label" text-anchor="start">SP：2列 → 間隔は1箇所</text><g class="band" data-n="2" data-gap="6" data-column="47" data-width="620"><rect x="68" y="339" width="624" height="62" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><rect class="track" data-start="70" data-width="291.4" x="71" y="342" width="289.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="215.7" y="378" class="column" text-anchor="middle">47%</text><rect class="gutter" x="361.4" y="341" width="37.2" height="58" fill="#ECE5FF" stroke="none"/><path d="M 380 402 v 14" stroke="#7C3AED" fill="none"/><text x="380" y="441" class="gap" text-anchor="middle">6%</text><rect class="track" data-start="398.59999999999997" data-width="291.4" x="399.59999999999997" y="342" width="289.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="544.3" y="378" class="column" text-anchor="middle">47%</text></g><text x="380" y="477" class="math" text-anchor="middle">47 × 2 ＋ 6 × 1 ＝ 100%</text></svg>
