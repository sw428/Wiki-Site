<svg xmlns="http://www.w3.org/2000/svg" width="538.46" height="760" viewBox="0 0 700 988" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">子Bの負のmargin-topで子B・C・Dが40px上へ詰まる</title>
<desc id="desc">通常フローで各兄弟の高さは100px、ほかの上下marginは0。子Bの上端にmargin-top: 0を表示し、子B・C・Dと各子が40px上へ移動した後にmargin-top: -40pxへ切り替える。指定値と境界の補助線は子Bと一緒に動く。子Aとその子は動かない。灰色の点線は子Bが子Aへ重なった面積で、移動に合わせて広がる。19秒周期で繰り返し、動きを減らす設定では指定後の静止図を表示する。移動は説明用のアニメーションで、途中の数値を連続表示するものではない。箱の外枠・親の灰色点線・重なりの点線は補助表示で、実際のCSSのborderではない。横幅と内部の子の寸法は模式的に示す。各段階の説明を表示して2.5秒以上待ち、その後3秒かけて移動する。親の灰色の塗りと外枠は内容に合わせて高さだけが縮む。外枠の点線は各辺の起点と間隔を保ち、縦辺の表示範囲と下辺の位置だけを変えるため外周に沿って流れない。説明は前の文字を消して0.25秒空白にし、次の文字を0.25秒で表示する。完全に表示してから2.5秒以上待ち、3秒かけて動く。説明は動作中も表示し、各動作の後にも静止時間を追加する。タイトルの直下に、対象を示すセレクタと波括弧で囲んだCSSを、VS CodeのLight+を基に彩度を抑えた構文色で示す。</desc>
