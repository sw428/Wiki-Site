<svg xmlns="http://www.w3.org/2000/svg" width="865.82" height="760" viewBox="0 0 1080 948" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">空の::afterのinline-blockとabsoluteで配置基準を比較する</title>
<desc id="desc">一行の横書きで、空の13px四方の疑似要素を比較する。上段のinline-blockは文字の後ろにmargin-left: 30pxを取って行内に並び、下側のmargin edgeがベースラインにそろう。この例は下margin・padding・borderがないため箱の下端が基準線に合う。下段のabsoluteは通常フローを外れ、position: relativeの親の右上にtop: 0; right: 0で合わせた位置から、top: 8pxで8px下へ、さらにright: -20pxで親の右端より20px外へずらす様子を18.5秒周期で繰り返す。left・bottomは指定せず、上端・右端を固定して幅は左へ・高さは下へ広がる関係を赤い矢印で示す。灰色の丸は親の右上、赤い丸は箱の右上。寸法と距離は4倍で、親と文字は模式的に示す。灰色の点線は親の範囲、青い点線はベースライン、オレンジは左marginを示す補助表示で、図の外枠は実際のCSSのborderではない。各段階の説明を表示して2.5秒以上待ち、その後3秒かけて移動する。説明は前の文字を消して0.25秒空白にし、次の文字を0.25秒で表示する。完全に表示してから2.5秒以上待ち、3秒かけて動く。説明は動作中も表示し、各動作の後にも静止時間を追加する。タイトルの直下に、対象を示すセレクタと波括弧で囲んだCSSを、VS CodeのLight+を基に彩度を抑えた構文色で示す。</desc>
<rect x="0" y="0" width="1080" height="948" fill="#ffffff"/>
<g id="drawing" transform="translate(0 78)">


<defs>
<style>text{font-family:'Yu Gothic','Meiryo',sans-serif}.heading{font-size:25px;font-weight:700}.small{font-size:18px}.code{font-family:Consolas,monospace;font-size:19px}.parent{fill:#f5f5f5}.outline{fill:none;stroke:#666666;stroke-width:2;stroke-dasharray:8 7}.red{fill:#c93030}.gray{fill:#444444}.measure{fill:none;stroke:#000000;stroke-width:1.5;marker-start:url(#dim);marker-end:url(#dim)}.guide{fill:none;stroke:#777777;stroke-width:1}</style><mask id="comparison-text"><rect width="1080" height="870" fill="white"/><rect x="65" y="218" width="330" height="72" fill="black"/><rect x="506" y="202" width="94" height="25" fill="black"/><rect x="65" y="566" width="330" height="70" fill="black"/></mask>
<marker id="dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#000000" stroke-width="1.5"/></marker>
<mask id="parent-label-clear" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="810"><rect width="1080" height="870" fill="#ffffff"/><rect x="506" y="202" width="94" height="25" fill="#000000"/></mask></defs>
<defs><marker id="move" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c93030" stroke-width="1.7"/></marker></defs><rect width="1080" height="870" fill="#ffffff"/>

<rect x="24" y="105" width="1032" height="325" rx="12" fill="#ffffff" stroke="#dddddd"/>
<text style="fill:#000000" x="44" y="146" class="heading" fill="#000000">① inline-block：文字と同じ行に参加する</text>
<text x="70" y="194" class="small gray">親 .link（文字と ::after を含む）</text>
<rect x="70" y="212" width="492" height="92" class="parent"/>
<rect x="70" y="212" width="492" height="92" class="outline" mask="url(#comparison-text)"/>
<rect x="390" y="228" width="120" height="52" fill="#f9cc9d"/>
<path d="M70 280 H592" fill="none" stroke="#315fa0" stroke-width="2" stroke-dasharray="4 5"/>
<text x="70" y="280" font-size="64" textLength="320" lengthAdjust="spacingAndGlyphs" style="fill:#315fa0">詳細を見る</text>
<rect x="510" y="228" width="52" height="52" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="510" y="223" class="small red">::after</text>
<text x="510" y="337" class="small red">13 × 13px</text>
<text x="70" y="337" class="small" style="fill:#315fa0">ベースライン</text>
<path d="M170 310 V290" fill="none" stroke="#315fa0" stroke-width="1.5"/>
<text x="338" y="371" class="small red">margin-left: 30px</text>
<path d="M450 351 V292" fill="none" stroke="#c93030" stroke-width="1.5"/>
<text x="70" y="405" class="small gray" fill="#000000" style="fill:#000000">空の箱では、下端がベースラインに揃う。</text>
<rect x="655" y="178" width="375" height="226" rx="8" fill="#f8fafc"/>
<text x="677" y="209" class="code">.link::after {</text>
<text x="699" y="240" class="code">content: "";</text>
<text x="699" y="271" class="code">display: inline-block;</text>
<text x="699" y="302" class="code">width: 13px; height: 13px;</text>
<text x="699" y="333" class="code">margin-left: 30px;</text>
<text x="677" y="364" class="code">}</text>
<rect x="24" y="450" width="1032" height="407" fill="#fff" stroke="#ddd" rx="12"/><text x="44" y="491" font-size="25" font-weight="700" fill="#000000">② absolute：親の右上から順にずらす</text><text style="fill:#000000" x="70" y="516" font-size="18" font-weight="400" fill="#000000">上端・右端を固定：幅は左へ、高さは下へ</text><text x="70" y="540" font-size="18" fill="#444444" font-weight="400">親 .link（position: relative）</text><rect x="70" y="558" width="320" height="92" fill="#f5f5f5" stroke="none" /><rect x="70" y="558" width="320" height="92" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/><text x="70" y="626" font-size="64" textLength="320" lengthAdjust="spacingAndGlyphs" fill="#315fa0">詳細を見る</text><rect x="338" y="558" width="52" height="52" fill="none" stroke="#c93030" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.55"/><circle cx="390" cy="558" r="3.5" fill="#444444"/><g id="moving-after" transform="translate(0 0)"><rect x="338" y="558" width="52" height="52" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/><line x1="390" y1="558" x2="338" y2="558" stroke="#c93030" stroke-width="2" marker-end="url(#move)"/><line x1="390" y1="558" x2="390" y2="610" stroke="#c93030" stroke-width="2" marker-end="url(#move)"/><circle cx="390" cy="558" r="4" fill="#fff" stroke="#c93030" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 32;0 32;80 32;80 32" keyTimes="0;0.162162162;0.324324324;0.540540541;0.702702703;1" dur="18.5s" repeatCount="indefinite"/></g><line x1="580" y1="558" x2="580" y2="590" stroke="#c93030" stroke-width="2" marker-end="url(#move)"/><text x="592" y="583" font-size="18" fill="#c93030" font-weight="400">top</text><g id="top-measure" opacity="0"><path d="M390 558 H514 M470 590 H514" class="guide"/><path d="M510 558 V590" class="measure"/><text x="520" y="578" font-size="18" fill="#000000" font-weight="400">8px</text><animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.324324324;0.702702703;1" calcMode="discrete" dur="18.5s" repeatCount="indefinite"/></g><g id="right-measure" opacity="0"><path d="M390 650 V694 M470 642 V694" class="guide"/><path d="M390 684 H470" class="measure"/><text x="370" y="719" font-size="18" fill="#000000" font-weight="400">右端から20px外側</text><text x="386" y="747" font-size="18" fill="#c93030" font-weight="400">right: -20px</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.324324324;0.702702703;1" calcMode="discrete" dur="18.5s" repeatCount="indefinite"/></g><g opacity="1"><text x="70" y="684" font-size="18" font-weight="700" fill="#000000">① 基準：top: 0; right: 0</text><animate attributeName="opacity" values="1;0.35;0.35;0.35" keyTimes="0;0.162162162;0.540540541;1" calcMode="discrete" dur="18.5s" repeatCount="indefinite"/></g><g opacity="0.35"><text x="70" y="720" font-size="18" font-weight="700" fill="#000000">② top: 8pxで下へ</text><animate attributeName="opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.162162162;0.540540541;1" calcMode="discrete" dur="18.5s" repeatCount="indefinite"/></g><g opacity="0.35"><text x="70" y="756" font-size="18" font-weight="700" fill="#000000">③ right: -20pxで外へ</text><animate attributeName="opacity" values="0.35;0.35;1;1" keyTimes="0;0.162162162;0.540540541;1" calcMode="discrete" dur="18.5s" repeatCount="indefinite"/></g><rect x="655" y="523" width="375" height="252" fill="#f8fafc" stroke="none" rx="8"/><text x="677" y="554" class="code">.link { position: relative; }</text><text x="677" y="591" class="code">.link::after {</text><text x="677" y="622" class="code">  content: &quot;&quot;;</text><text x="677" y="653" class="code">  position: absolute;</text><text id="coordinate-step-0" x="677" y="684" class="code" visibility="visible">  right: 0; top: 0;<animate attributeName="visibility" values="visible;hidden;hidden;hidden" keyTimes="0;0.162162162;0.540540541;1" calcMode="discrete" dur="18.5s" repeatCount="indefinite"/></text><text id="coordinate-step-1" x="677" y="684" class="code" visibility="hidden">  right: 0; top: 8px;<animate attributeName="visibility" values="hidden;visible;hidden;hidden" keyTimes="0;0.162162162;0.540540541;1" calcMode="discrete" dur="18.5s" repeatCount="indefinite"/></text><text id="coordinate-step-2" x="677" y="684" class="code" visibility="hidden">  right: -20px; top: 8px;<animate attributeName="visibility" values="hidden;hidden;visible;visible" keyTimes="0;0.162162162;0.540540541;1" calcMode="discrete" dur="18.5s" repeatCount="indefinite"/></text><text x="677" y="715" class="code">  width: 13px; height: 13px;</text><text x="677" y="746" class="code">}</text><text x="70" y="822" font-size="18" font-weight="400" fill="#000000">① → ② → ③を繰り返す。灰色の丸＝親の右上、赤い丸＝箱の右上。</text><g id="stage-caption" class="caption"><g class="caption-state caption-state-0"><text class="stage-cue" x="70" y="790" text-anchor="start" fill="#000000" style="fill:#000000;font-family:Yu Gothic,Meiryo,sans-serif;font-size:19px;font-weight:700"><tspan x="70">topを指定し、箱を8px下へ</tspan></text></g><g class="caption-state caption-state-1"><text class="stage-cue" x="70" y="790" text-anchor="start" fill="#000000" style="fill:#000000;font-family:Yu Gothic,Meiryo,sans-serif;font-size:19px;font-weight:700"><tspan x="70">rightを指定し、箱を20px右へ</tspan></text></g><g class="caption-state caption-state-2"><text class="stage-cue" x="70" y="790" text-anchor="start" fill="#000000" style="fill:#000000;font-family:Yu Gothic,Meiryo,sans-serif;font-size:19px;font-weight:700"><tspan x="70">移動後：親の右端より20px外側</tspan></text></g></g></g>
<text x="36" y="48" font-size="30" font-weight="700" fill="#000000">::after は「行に参加」か「位置を指定」か</text>
<g id="css"><text x="28" y="84" xml:space="preserve" style="font-family:Consolas,Meiryo,monospace;font-size:19px;font-weight:500;fill:#313539"><tspan x="28"><tspan fill="#4C764C" style="fill:#4C764C">/* 上段 */</tspan><tspan fill="#313539" style="fill:#313539"> </tspan><tspan fill="#744047" style="fill:#744047">.link::after</tspan><tspan fill="#313539" style="fill:#313539"> { </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">display</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#365F8F" style="fill:#365F8F">inline-block</tspan><tspan fill="#313539" style="fill:#313539">;</tspan></tspan><tspan x="28" dy="28"><tspan fill="#313539" style="fill:#313539">  </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">margin-left</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">30px</tspan><tspan fill="#313539" style="fill:#313539">; }</tspan></tspan><tspan x="28" dy="28"><tspan fill="#4C764C" style="fill:#4C764C">/* 下段 */</tspan><tspan fill="#313539" style="fill:#313539"> </tspan><tspan fill="#744047" style="fill:#744047">.link::after</tspan><tspan fill="#313539" style="fill:#313539"> { </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">position</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#365F8F" style="fill:#365F8F">absolute</tspan><tspan fill="#313539" style="fill:#313539">;</tspan></tspan><tspan x="28" dy="28"><tspan fill="#313539" style="fill:#313539">  </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">top</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">8px</tspan><tspan fill="#313539" style="fill:#313539">; </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">right</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">-20px</tspan><tspan fill="#313539" style="fill:#313539">; }</tspan></tspan></text></g>
<style id="caption-timing">.caption .caption-state{opacity:0}.caption .caption-state-2{opacity:1}@media(prefers-reduced-motion:no-preference){.caption .caption-state-0{animation:caption-state-0 18.5s linear infinite both}@keyframes caption-state-0{0%{opacity:0}1.351351351%{opacity:0}2.702702703%{opacity:1}31.081081081%{opacity:1}32.432432432%{opacity:0}100%{opacity:0}}.caption .caption-state-1{animation:caption-state-1 18.5s linear infinite both}@keyframes caption-state-1{0%{opacity:0}32.432432432%{opacity:0}33.783783784%{opacity:0}35.135135135%{opacity:1}68.918918919%{opacity:1}70.27027027%{opacity:0}100%{opacity:0}}.caption .caption-state-2{animation:caption-state-2 18.5s linear infinite both}@keyframes caption-state-2{0%{opacity:0}70.27027027%{opacity:0}71.621621622%{opacity:0}72.972972973%{opacity:1}98.648648649%{opacity:1}100%{opacity:0}}}</style></svg>
