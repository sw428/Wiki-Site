<title id="title">① 親をGridにする</title><desc id="desc">親へdisplay: gridだけを加える。この通常の自動配置では同じ子A〜Fが1列で並ぶ。親幅と子の表示用CSSは共通。</desc>
<metadata id="grid-data">{"type":"static","states":[{"width":510,"height":240,"rows":[40,40,40,40,40,40],"gapx":0,"gapy":0,"items":[{"id":"A","x":0,"y":0,"w":510,"h":40},{"id":"B","x":0,"y":40,"w":510,"h":40},{"id":"C","x":0,"y":80,"w":510,"h":40},{"id":"D","x":0,"y":120,"w":510,"h":40},{"id":"E","x":0,"y":160,"w":510,"h":40},{"id":"F","x":0,"y":200,"w":510,"h":40}]}]}</metadata>
<style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:23px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.small{font-size:18px}.parent-label{fill:#444444}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.status{fill:#000000}.track{fill:none;stroke:#007F99;stroke-width:1.5}.edge{stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.code .active-css{fill:#c93030}.gap-region{fill:#ECE5FF;stroke:none}.parent-note{font-size:12px;fill:#000000}</style><rect width="640" height="517.0" fill="#ffffff" />
<text x="24" y="34" class="title">① 親をGridにする</text>
