<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">列数の変更とgapの変更を、一つずつ見る</title><desc id="desc">各帯は同じ100%。まず3列gap2%から、gap2%を保って2列に変更すると列幅49%。次に2列を保ってgap6%に変更すると列幅47%。</desc><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#000000}.heading{font-size:25px;font-weight:700}.body{font-size:21px}.sub{font-size:19px}.note{font-size:14px}.column{font-size:23px;fill:#007F99}.gap{font-size:20px;fill:#7C3AED}.parent{font-size:20px;fill:#444444}.math{font-size:23px}.label{font-size:22px;font-weight:700}</style><rect width="760" height="600" fill="#ffffff"/><text x="32" y="42" class="heading" text-anchor="start">列数の変更とgapの変更を、一つずつ見る</text><text x="728" y="72" class="note" text-anchor="end">※ 灰色の線はborderではなく、親の範囲を示す補助線です。</text><text x="70" y="112" class="label" text-anchor="start">1. 3列・gap 2%：一列は32%</text><g class="band" data-n="3" data-gap="2" data-column="32" data-width="620"><rect x="68" y="127" width="624" height="62" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><rect class="track" data-start="70" data-width="198.4" x="71" y="130" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="169.2" y="166" class="column" text-anchor="middle">32%</text><rect class="gutter" x="268.4" y="129" width="12.4" height="58" fill="#ECE5FF" stroke="none"/><path d="M 274.59999999999997 190 v 14" stroke="#7C3AED" fill="none"/><text x="274.59999999999997" y="229" class="gap" text-anchor="middle">2%</text><rect class="track" data-start="280.8" data-width="198.4" x="281.8" y="130" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="380" y="166" class="column" text-anchor="middle">32%</text><rect class="gutter" x="479.20000000000005" y="129" width="12.4" height="58" fill="#ECE5FF" stroke="none"/><path d="M 485.40000000000003 190 v 14" stroke="#7C3AED" fill="none"/><text x="485.40000000000003" y="229" class="gap" text-anchor="middle">2%</text><rect class="track" data-start="491.6" data-width="198.4" x="492.6" y="130" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="590.8000000000001" y="166" class="column" text-anchor="middle">32%</text></g><text x="70" y="269" class="label" text-anchor="start">2. 列数だけ2列へ：一列は49%</text><g class="band" data-n="2" data-gap="2" data-column="49" data-width="620"><rect x="68" y="284" width="624" height="62" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><rect class="track" data-start="70" data-width="303.8" x="71" y="287" width="301.8" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="221.9" y="323" class="column" text-anchor="middle">49%</text><rect class="gutter" x="373.8" y="286" width="12.4" height="58" fill="#ECE5FF" stroke="none"/><path d="M 380 347 v 14" stroke="#7C3AED" fill="none"/><text x="380" y="386" class="gap" text-anchor="middle">2%</text><rect class="track" data-start="386.2" data-width="303.8" x="387.2" y="287" width="301.8" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="538.1" y="323" class="column" text-anchor="middle">49%</text></g><text x="70" y="426" class="label" text-anchor="start">3. gapを6%へ：一列は47%</text><g class="band" data-n="2" data-gap="6" data-column="47" data-width="620"><rect x="68" y="441" width="624" height="62" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><rect class="track" data-start="70" data-width="291.4" x="71" y="444" width="289.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="215.7" y="480" class="column" text-anchor="middle">47%</text><rect class="gutter" x="361.4" y="443" width="37.2" height="58" fill="#ECE5FF" stroke="none"/><path d="M 380 504 v 14" stroke="#7C3AED" fill="none"/><text x="380" y="543" class="gap" text-anchor="middle">6%</text><rect class="track" data-start="398.59999999999997" data-width="291.4" x="399.59999999999997" y="444" width="289.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="544.3" y="480" class="column" text-anchor="middle">47%</text></g><text x="380" y="582" class="sub" text-anchor="middle">各段階の親幅は100%。変えた条件を順に比較する。</text></svg>
