<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">まず、親の内容幅と1箇所の列間を測る</title><desc id="desc">仮の親の内容幅1000pxを620単位へ縮尺表示。320pxの列3本と20pxのgap2箇所が1000pxを使い切る。1箇所の列間20pxを1000pxで割ると2%。</desc><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#000000}.heading{font-size:25px;font-weight:700}.body{font-size:21px}.sub{font-size:19px}.note{font-size:14px}.column{font-size:23px;fill:#007F99}.gap{font-size:20px;fill:#7C3AED}.parent{font-size:20px;fill:#444444}.math{font-size:23px}.label{font-size:22px;font-weight:700}</style><rect width="760" height="350" fill="#ffffff"/><text x="32" y="42" class="heading" text-anchor="start">まず、親の内容幅と1箇所の列間を測る</text><text x="728" y="72" class="note" text-anchor="end">※ 灰色の線はborderではなく、親の範囲を示す補助線です。</text><text x="70" y="112" class="parent" text-anchor="start">親の内容幅 1000px（この範囲を100%とする）</text><g class="band" data-n="3" data-gap="2" data-column="32" data-width="620"><rect x="68" y="133" width="624" height="62" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><rect class="track" data-start="70" data-width="198.4" x="71" y="136" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="169.2" y="172" class="column" text-anchor="middle">320px</text><rect class="gutter" x="268.4" y="135" width="12.4" height="58" fill="#ECE5FF" stroke="none"/><path d="M 274.59999999999997 196 v 14" stroke="#7C3AED" fill="none"/><text x="274.59999999999997" y="235" class="gap" text-anchor="middle">20px</text><rect class="track" data-start="280.8" data-width="198.4" x="281.8" y="136" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="380" y="172" class="column" text-anchor="middle">320px</text><rect class="gutter" x="479.20000000000005" y="135" width="12.4" height="58" fill="#ECE5FF" stroke="none"/><path d="M 485.40000000000003 196 v 14" stroke="#7C3AED" fill="none"/><text x="485.40000000000003" y="235" class="gap" text-anchor="middle">20px</text><rect class="track" data-start="491.6" data-width="198.4" x="492.6" y="136" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="590.8000000000001" y="172" class="column" text-anchor="middle">320px</text></g><text x="380" y="284" class="math" text-anchor="middle">20 ÷ 1000 × 100 ＝ 2%</text><text x="380" y="320" class="sub" text-anchor="middle">紫の帯は列と列の間。外側の余白は含めない。</text></svg>
