<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296.4" viewBox="0 51 1000 390" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">padding・borderがない親と最初の子の上marginが相殺する</title>
<desc id="desc">通常フローのブロック配置で、親と最初の子の上marginが相殺する条件を満たし、前の要素にはmarginがない例。親の上側にはpaddingもborderもなく、親のmargin-top: 20pxと子のmargin-top: 40pxが相殺して40pxになる。前の要素の下端から親と子の上端まで40pxで、親と子の上端はそろう。オレンジは親の外側のmarginを示す説明用の色。灰色の実線は親の範囲を示す補助線で、実際のCSSのborderではない。寸法と配置は模式的に示す。</desc>
<rect x="0" y="100" width="1000" height="341" fill="#FFFFFF"/>
<rect x="26" y="114" width="948" height="313" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
<rect x="26" y="114" width="948" height="52" rx="16" fill="#E9F4FB"/>
<rect x="26" y="154" width="948" height="12" rx="0" fill="#E9F4FB"/>
<text x="49" y="148" font-family="'Noto Sans CJK JP', sans-serif" font-size="23" font-weight="700" fill="#000000">① 相殺する（padding・borderなし）</text>
<rect x="835" y="124" width="116" height="33" rx="16" fill="#FFFFFF" stroke="#BFD3E5" stroke-width="1"/>
<text style="fill:#000000" x="893" y="147" font-family="'Noto Sans CJK JP', sans-serif" font-size="16" fill="#000000" font-weight="700" text-anchor="middle">基本</text>
<rect x="73" y="179" width="420" height="43" rx="4" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.3"/>
<text x="283" y="207" font-family="'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#315fa0">前の要素（margin: 0）</text>
<rect x="73" y="222" width="420" height="50" rx="0" fill="#f9cc9d"/>
<text x="283" y="252" font-family="'Noto Sans CJK JP', sans-serif" font-size="18" fill="#000000" font-weight="700" text-anchor="middle" style="fill:#000000">40px（相殺結果）</text>
<rect x="73" y="272" width="420" height="141" rx="0" fill="#f5f5f5"/>
<rect x="73" y="272" width="420" height="48" rx="0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.3"/>
<text x="283" y="303" font-family="'Noto Sans CJK JP', sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#c93030">子要素</text>
<text x="283" y="401" font-family="'Noto Sans CJK JP', sans-serif" font-size="16" fill="#444444" font-weight="700" text-anchor="middle">親要素</text>
<line x1="70.35" y1="269.35" x2="495.65" y2="269.35" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.65" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<line x1="70.35" y1="269.35" x2="70.35" y2="415.65" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.65" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<line x1="495.65" y1="269.35" x2="495.65" y2="415.65" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.65" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<line x1="70.35" y1="415.65" x2="495.65" y2="415.65" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.65" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<text x="71" y="264" font-family="'Noto Sans CJK JP', sans-serif" font-size="14" fill="#444444" font-weight="700">親の上端</text>
<rect x="521" y="176" width="435" height="135" rx="10" fill="#F4F6F8" stroke="#DCE2E9" stroke-width="1.2"/>
<text x="540" y="207" font-family="'Noto Sans Mono CJK JP', monospace" font-size="18" fill="#000000">.parent { margin-top: 20px; }</text>
<text x="540" y="234" font-family="'Noto Sans Mono CJK JP', monospace" font-size="18" fill="#000000">.child  { margin-top: 40px; }</text>
<text style="fill:#000000" x="521" y="337" font-family="'Noto Sans CJK JP', sans-serif" font-size="18" fill="#000000">前の要素 → 子要素の上端：</text>
<text x="848" y="337" font-family="'Noto Sans CJK JP', sans-serif" font-size="28" fill="#000000" font-weight="700" style="fill:#000000">40px</text>
<text x="521" y="369" font-family="'Noto Sans CJK JP', sans-serif" font-size="19" fill="#000000" font-weight="700" style="fill:#000000">max(20px, 40px) = 40px</text>
<text style="fill:#000000" x="521" y="400" font-family="'Noto Sans CJK JP', sans-serif" font-size="15" fill="#000000">親の外側で40px。親と子の上端は同じ位置。</text>
<g id="parent-boundary-note"><rect x="0" y="51" width="1000" height="49" fill="#ffffff"/><text x="986" y="69.2" text-anchor="end" style="fill:#444444;font-family:Yu Gothic,Meiryo,sans-serif;font-size:14px;font-weight:400"><tspan x="986">※ 灰色の線はborderではなく、</tspan><tspan x="986" dy="21">親の範囲を示す補助線です。</tspan></text></g></svg>
