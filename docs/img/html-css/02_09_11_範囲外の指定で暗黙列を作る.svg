<svg xmlns="http://www.w3.org/2000/svg" width="640" height="414.0" viewBox="0 0 640 414.0" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">範囲外の指定で暗黙列が増える</title><desc id="desc">親幅510pxで列幅150pxを2本明示し、gap30pxを指定。子Aをgrid-column:5/6へ置くと、3〜5列目は暗黙列となり、空の3・4列目も作られる。grid-auto-columns:150pxのため列全体は870pxになり親からあふれる。横方向は0.6倍、縦方向は模式表示。</desc><metadata id="grid-data">{"type":"static","parentWidth":510,"trackWidth":150,"gap":30,"explicitColumns":2,"implicitColumns":3,"targetStart":5,"targetEnd":6,"usedWidth":870,"scale":0.6}</metadata><style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:23px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.small{font-size:18px}.parent-label{fill:#444444}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.status{fill:#000000}.track{fill:none;stroke:#007F99;stroke-width:1.5}.edge{stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.code .active-css{fill:#c93030}.gap-region{fill:#ECE5FF;stroke:none}.parent-note{font-size:12px;fill:#000000}</style><rect width="640" height="414.0" fill="#fff" /><text x="24" y="34" class="title">範囲外の指定で暗黙列が増える</text><text x="24" y="96.0" class="code">.parent { grid-auto-columns: 150px; }</text><text x="24" y="123.0" class="code">.target { <tspan class="active-css">grid-column: 5 / 6;</tspan> }</text><rect x="48.0" y="196.0" width="306.0" height="80.0" fill="#f5f5f5" /><rect x="48.0" y="196.0" width="90.0" height="80.0" fill="#cfe4ff" stroke="#007F99" stroke-width="1.5" /><text x="65" y="308.0" class="small column">1列目</text><rect x="138.0" y="196.0" width="18.0" height="80.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="156.0" y="196.0" width="90.0" height="80.0" fill="#cfe4ff" stroke="#007F99" stroke-width="1.5" /><text x="173" y="308.0" class="small column">2列目</text><rect x="246.0" y="196.0" width="18.0" height="80.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="264.0" y="196.0" width="90.0" height="80.0" fill="none" stroke="#007F99" stroke-width="1.5" stroke-dasharray="5 4" /><text x="281" y="308.0" class="small column">3列目</text><rect x="354.0" y="196.0" width="18.0" height="80.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="372.0" y="196.0" width="90.0" height="80.0" fill="none" stroke="#007F99" stroke-width="1.5" stroke-dasharray="5 4" /><text x="389" y="308.0" class="small column">4列目</text><rect x="462.0" y="196.0" width="18.0" height="80.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="480.0" y="196.0" width="90.0" height="80.0" fill="none" stroke="#007F99" stroke-width="1.5" stroke-dasharray="5 4" /><text x="497" y="308.0" class="small column">5列目</text><rect x="480.0" y="196.0" width="90.0" height="80.0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="516.875" y="243.0" class="">A</text><text x="147" y="350.0" class="small column" text-anchor="middle">青・実線：明示した2列</text><text x="417" y="350.0" class="small column" text-anchor="middle">破線：追加された3列</text><text x="24" y="389.0" class="small">列全体は870px。空の3・4列目も作られる。</text><g fill="none" stroke="#007F99" stroke-width="1.5"><path d="M 48 321 V 327 H 246 V 321" /></g><g fill="none" stroke="#007F99" stroke-width="1.5" stroke-dasharray="5 4"><path d="M 264 321 V 327 H 570 V 321" /></g><rect x="45.25" y="193.25" width="311.5" height="85.5" fill="none" class="edge" data-parent-boundary="true" data-outline-offset="2.75" style="stroke-dasharray:none" data-outline-gap="1" /><g class="parent-note-block" data-layout-shift="24"><text x="400" y="65" class="parent-note">※ 灰色の線はborderではなく、</text><text x="400" y="83" class="parent-note">親の範囲を示す補助線です。</text></g></svg>
