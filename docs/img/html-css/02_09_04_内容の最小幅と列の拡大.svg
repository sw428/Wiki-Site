<svg xmlns="http://www.w3.org/2000/svg" width="640" height="462" viewBox="0 0 640 462.0" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">1frでも内容が列幅に影響する</title><desc id="desc">短い内容の等幅と、折り返せない内容によって列が広がる場合の比較。広がった寸法は実測値ではない。</desc>
<metadata id="grid-data">{"type":"static","states":[{"width":510,"height":40,"rows":[40],"gapx":30,"gapy":30,"items":[{"id":"A","x":0,"y":0,"w":240,"h":40},{"id":"B","x":270,"y":0,"w":240,"h":40}]},{"width":510,"height":40,"rows":[40],"gapx":30,"gapy":30,"items":[{"id":"A","x":0,"y":0,"w":360,"h":40},{"id":"B","x":390,"y":0,"w":120,"h":40}]}],"schematic":true}</metadata>
<style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:23px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.small{font-size:18px}.parent-label{fill:#444444}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.status{fill:#000000}.track{fill:none;stroke:#007F99;stroke-width:1.5}.edge{stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.code .active-css{fill:#c93030}.gap-region{fill:#ECE5FF;stroke:none}.parent-note{font-size:12px;fill:#000000}</style><rect width="640" height="462.0" fill="#ffffff" />
<text x="24" y="34" class="title">1frでも内容が列幅に影響する</text>
<text x="24" y="96.0" class="code" xml:space="preserve">.parent {</text><text x="24" y="121.0" class="code" xml:space="preserve">  <tspan class="active-css">grid-template-columns: 1fr 1fr;</tspan></text><text x="24" y="146.0" class="code" xml:space="preserve">}</text><text x="24" y="200.0">短い内容：同じ重みで配れる</text><rect fill="#f5f5f5" x="48.0" y="222.0" width="510.0" height="40.0" /><rect class="gap-region" fill="#ECE5FF" stroke="none" x="288.0" y="222.0" width="30.0" height="40.0" /><rect data-child="A" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" x="48.0" y="222.0" width="240" height="40" /><rect data-child="B" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" x="318.0" y="222.0" width="240" height="40" /><text data-label="B" style="fill:#315fa0" x="328.0" y="247.0">B</text><text x="58.38961039" y="249.77777778" style="fill:#c93030">A</text><text x="24" y="316.0">長い内容：最小幅によって広がる場合がある</text><rect fill="#f5f5f5" x="48.0" y="338.0" width="510.0" height="40.0" /><rect class="gap-region" fill="#ECE5FF" stroke="none" x="408.0" y="338.0" width="30.0" height="40.0" /><rect data-child="A" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" x="48.0" y="338.0" width="360" height="40" /><rect data-child="B" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" x="438.0" y="338.0" width="120" height="40" /><text data-label="B" style="fill:#315fa0" x="448.0" y="363.0">B</text><text x="58.28571429" y="365.77777778" class="small">折り返せない長い内容</text><text x="24" y="430.0" class="small">広がった列の寸法は模式表示。実際は内容による。</text>
