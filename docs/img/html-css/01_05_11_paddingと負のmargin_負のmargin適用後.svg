<svg xmlns="http://www.w3.org/2000/svg" width="868.07" height="760" viewBox="0 0 980 858" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">親のpaddingと子の負のmargin-topによる位置調整</title>
<desc id="desc">前の要素の下端を0px、親の上端を250pxとする。親のpadding-top: 100pxによる子の通常位置350pxから、子のmargin-top: -150pxによって150px上へ動き、子の上端が200pxになる。子は親の上端より50px上にはみ出す。子のmargin-bottom: 60pxの領域と後続の見出しも、子と一緒に上へ移る。通常位置から指定後までを25秒周期で繰り返し、動きを減らす設定では指定後の静止図を表示する。通常フローのブロック配置で、ほかのmarginやborder、位置指定の影響がない例。縦の距離はCSSの1pxを図の0.8単位で示し、箱の大きさは模式的で親の下側は省略する。灰色の点線は親の範囲を示す補助線で、実際のCSSのborderではない。各段階の説明を表示して2.5秒以上待ち、その後3秒かけて移動する。説明は前の文字を消して0.25秒空白にし、次の文字を0.25秒で表示する。完全に表示してから2.5秒以上待ち、3秒かけて動く。説明は動作中も表示し、各動作の後にも静止時間を追加する。タイトルの直下に、対象を示すセレクタと波括弧で囲んだCSSを、VS CodeのLight+を基に彩度を抑えた構文色で示す。</desc>
<rect x="0" y="0" width="980" height="858" fill="#ffffff"/>
<g id="drawing" transform="translate(0 38)">


<defs>
<marker id="black" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000000" stroke-width="2"/>
</marker>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#315fa0" stroke-width="2"/>
</marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#26724a" stroke-width="2"/>
</marker>
<marker id="red" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#c93030" stroke-width="2"/></marker>
</defs>
<style>
  @media (prefers-reduced-motion: no-preference) {
    .moving { animation: move 25s infinite; }
    .applied { animation: reveal 25s infinite; }
    @keyframes move {
      0%, 12% { transform: translateY(120px); }
      24.000000001%, 100% { transform: translateY(0); }}
    @keyframes reveal {
      0%, 24.000000001%, 99.2%, 100% { opacity: 0; }
      35.199999999%, 97.6% { opacity: 1; }}
  }
</style>
<g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
<rect x="0" y="0" width="980" height="820" fill="#ffffff" />



<rect x="180" y="140" width="400" height="80" fill="#cfe4ff" stroke="#315fa0" stroke-width="2" />
<text x="380" y="190" font-size="29" font-weight="700" text-anchor="middle" fill="#315fa0">前の要素 .before</text>
<rect x="180" y="220" width="400" height="200" fill="#f9cc9d" />
<rect x="180" y="420" width="400" height="280" fill="#f5f5f5" />
<rect x="180" y="420" width="400" height="80" fill="#cae6d1" />
<line x1="180" y1="420" x2="580" y2="420" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="180" y1="420" x2="180" y2="700" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="580" y1="420" x2="580" y2="700" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
<text x="380" y="664" font-size="27" fill="#444444" font-weight="700" text-anchor="middle">親要素 .parent</text>
<text x="380" y="693" font-size="20" font-weight="400" text-anchor="middle" fill="#000000">↓ 下へ続く</text>
<line x1="165" y1="220" x2="615" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
<text style="fill:#000000" x="710" y="227" font-size="22" fill="#000000" font-weight="400" text-anchor="start">前の要素の下端：0px</text>
<text x="710" y="427" font-size="22" fill="#444444" font-weight="400" text-anchor="start">親の上端：250px</text>
<text x="380" y="306" font-size="22" fill="#315fa0" font-weight="600" text-anchor="middle">前の要素のmargin-bottom</text>
<text x="380" y="340" font-size="25" fill="#315fa0" font-weight="700" text-anchor="middle">250px</text>
<g class="moving" id="moving-child-and-following-heading">
<rect x="235" y="380" width="290" height="80" fill="#f8cfd6" stroke="#c93030" stroke-width="2" />
<text x="380" y="432" font-size="28" font-weight="700" text-anchor="middle" fill="#c93030">子要素 .child</text>
<rect x="235" y="460" width="290" height="48" fill="#f9cc9d" />
<text x="380" y="492" font-size="23" fill="#c93030" font-weight="600" text-anchor="middle">下margin: 60px</text>
<rect x="235" y="508" width="290" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="2" />
<text x="380" y="536" font-size="24" font-weight="700" text-anchor="middle" fill="#315fa0">見出し .heading</text>
 </g>
<g class="applied">
<line x1="130" y1="220" x2="130" y2="380" stroke="#000000" stroke-width="3" marker-start="url(#black)" marker-end="url(#black)"/>
<text x="115" y="288" font-size="20" fill="#000000" font-weight="600" text-anchor="end">実際の距離</text>
<text x="115" y="321" font-size="24" fill="#000000" font-weight="700" text-anchor="end">200px</text>
<line x1="585" y1="500" x2="685" y2="500" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="665" y1="500" x2="665" y2="380" stroke="#c93030" stroke-width="3" marker-end="url(#red)"/>
<text x="710" y="474" font-size="25" fill="#c93030" font-weight="700" text-anchor="start">150px上へ</text>
<text x="710" y="387" font-size="22" fill="#000000" font-weight="700" text-anchor="start" style="fill: #000000">子の上端：200px</text>
</g>
<text x="710" y="507" font-size="22" fill="#000000" font-weight="400" text-anchor="start" style="fill:#000000">通常位置：350px</text>
<text x="710" y="574" font-size="21" fill="#26724a" font-weight="400" text-anchor="start">padding-top: 100px</text>
<g class="applied">
<text style="fill:#000000" x="710" y="615" font-size="23" fill="#000000" font-weight="400" text-anchor="start">親の上端より</text>
<text x="710" y="648" font-size="23" fill="#000000" font-weight="700" text-anchor="start">50px上にはみ出す</text>
<rect x="30" y="716" width="920" height="53" fill="#fff1f2" />
<text x="490" y="753" font-size="31" fill="#000000" font-weight="700" text-anchor="middle">250 + 100 − 150 = 200px</text>
</g>
<text style="fill:#000000" x="40" y="798" font-size="20" fill="#000000" font-weight="400" text-anchor="start">点線は親の補助線で、CSSのborderではありません。図は模式図です。</text>
</g>
<g id="stage-caption" class="caption"><text class="cue-before caption-state caption-state-0" x="710" y="150" text-anchor="start" fill="#000000" style="fill:#000000;font-family:Yu Gothic,Meiryo,sans-serif;font-size:20px;font-weight:700"><tspan x="710">子のtopの－marginで</tspan><tspan x="710" dy="28">子と見出しが150px上へ</tspan></text><text class="cue-after caption-state caption-state-1" x="710" y="150" text-anchor="start" fill="#000000" style="fill:#000000;font-family:Yu Gothic,Meiryo,sans-serif;font-size:20px;font-weight:700"><tspan x="710">移動後</tspan><tspan x="710" dy="28">子の上端は200px</tspan></text></g></g>
<text x="52" y="61" font-size="35" font-weight="700" text-anchor="start" fill="#000000">③ 子の負のmargin-top</text>
<g id="css"><text x="28" y="97" xml:space="preserve" style="font-family:Consolas,Meiryo,monospace;font-size:19px;font-weight:500;fill:#313539"><tspan x="28"><tspan fill="#744047" style="fill:#744047">.before</tspan><tspan fill="#313539" style="fill:#313539"> { </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">margin-bottom</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">250px</tspan><tspan fill="#313539" style="fill:#313539">; }</tspan></tspan><tspan x="28" dy="28"><tspan fill="#744047" style="fill:#744047">.parent</tspan><tspan fill="#313539" style="fill:#313539"> { </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">padding</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">100px</tspan><tspan fill="#313539" style="fill:#313539"> </tspan><tspan fill="#3B765B" style="fill:#3B765B">30px</tspan><tspan fill="#313539" style="fill:#313539">; }</tspan></tspan><tspan x="28" dy="28"><tspan fill="#744047" style="fill:#744047">.child</tspan><tspan fill="#313539" style="fill:#313539"> { </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">width</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">400px</tspan><tspan fill="#313539" style="fill:#313539">; </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">margin</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">-150px</tspan><tspan fill="#313539" style="fill:#313539"> </tspan><tspan fill="#365F8F" style="fill:#365F8F">auto</tspan><tspan fill="#313539" style="fill:#313539"> </tspan><tspan fill="#3B765B" style="fill:#3B765B">60px</tspan><tspan fill="#313539" style="fill:#313539">; }</tspan></tspan></text></g>
<style id="caption-timing">.caption .caption-state{opacity:0}.caption .caption-state-1{opacity:1}@media(prefers-reduced-motion:no-preference){.caption .caption-state-0{animation:caption-state-0 25s linear infinite both}@keyframes caption-state-0{0%{opacity:0}1%{opacity:0}2%{opacity:1}23%{opacity:1}24%{opacity:0}100%{opacity:0}}.caption .caption-state-1{animation:caption-state-1 25s linear infinite both}@keyframes caption-state-1{0%{opacity:0}24%{opacity:0}25%{opacity:0}26%{opacity:1}99%{opacity:1}100%{opacity:0}}}</style></svg>
