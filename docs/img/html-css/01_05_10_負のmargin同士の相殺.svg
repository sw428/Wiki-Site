<svg xmlns="http://www.w3.org/2000/svg" width="857.14" height="760" viewBox="0 0 900 798" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
<title id="title">兄弟要素の負の上下marginが相殺し、30px重なる</title>
<desc id="description">通常フローの兄弟ブロック要素で、上下marginが相殺する条件を満たす例。子Aのmargin-bottom: -20pxと子Bのmargin-top: -30pxは足し合わせず、絶対値が大きい-30pxが相殺結果となり、子Aと子Bが30px重なる。両方のmarginが0の通常位置から、相殺後の位置までを25秒周期で繰り返す。指定値を別々に足して移動させる図ではない。子Aは動かず、子Bが30px上へ詰まる。重なりと結果の寸法は移動後に表示し、動きを減らす設定では指定後の静止図を表示する。親の灰色点線は説明用の補助線で、実際のCSSのborderではない。各段階の説明を表示して2.5秒以上待ち、その後3秒かけて移動する。説明は前の文字を消して0.25秒空白にし、次の文字を0.25秒で表示する。完全に表示してから2.5秒以上待ち、3秒かけて動く。説明は動作中も表示し、各動作の後にも静止時間を追加する。タイトルの直下に、対象を示すセレクタと波括弧で囲んだCSSを、VS CodeのLight+を基に彩度を抑えた構文色で示す。</desc>
<rect x="0" y="0" width="900" height="798" fill="#ffffff"/>
<g id="drawing" transform="translate(0 60)">


  <style>
    text { font-family: "Noto Sans CJK JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; fill: #000000; }
    .title { font-size: 33px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #545961; }
    .heading { font-size: 21px; font-weight: 700; }
    .body { font-size: 19px; }
    .sm { font-size: 16px; }
    .box-label { font-size: 28px; font-weight: 700; }
    .numeric { font-size: 23px; font-weight: 700; fill: #000000; }
    .result { font-size: 26px; font-weight: 700; fill: #000000; }
    .dim { stroke: #000000; stroke-width: 2.6; fill:none; stroke-linecap:round; }
    @media (prefers-reduced-motion: no-preference) {
      .moving { animation: move 25s infinite; }
      .applied { animation: reveal 25s infinite; }
      @keyframes move {
        0%, 12% { transform: translateY(30px); }
        24.000000001%, 100% { transform: translateY(0); }}
      @keyframes reveal {
        0%, 24.000000001%, 99.2%, 100% { opacity: 0; }
        35.199999999%, 97.6% { opacity: 1; }}
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#000000" />
    </marker>
  </defs>
  <rect width="900" height="880" fill="#ffffff"/>

  <text style="fill:#000000" fill="#000000" x="58" y="110" class="subtitle">通常フローの兄弟ブロック要素（相殺する場合）</text>

  <g id="plot" transform="translate(0 -142)">

  <!-- Reference parent enclosure: a guide, not a CSS border -->
  <rect x="85" y="316" width="730" height="340" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="110" y="346" class="sm" fill="#444444" style="fill: #444444">親要素（破線は説明用）</text>

  <!-- child A, ending at y=503 -->
  <rect x="195" y="370" width="425" height="133" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
  <text x="408" y="430" text-anchor="middle" class="box-label" fill="#315fa0" style="fill:#315fa0">子A</text>
  <text x="408" y="463" text-anchor="middle" class="sm" style="fill: #315fa0">margin-bottom: -20px</text>

  <!-- child B begins 30 px above child A's bottom -->
  <g class="moving" id="moving-child-b">
  <rect x="195" y="473" width="425" height="133" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
  <!-- overlapping area, highlighted for teaching clarity -->
  <g class="applied">
  <rect x="195" y="473" width="425" height="30" fill="#dca7b8" opacity="0.55"/>
  <path d="M195 473 H620 M195 503 H620" stroke="#666666" stroke-width="1.6" stroke-dasharray="6 5"/>
  </g>
  <text x="408" y="551" text-anchor="middle" class="box-label" fill="#c93030" style="fill:#c93030">子B</text>
  <text x="408" y="585" text-anchor="middle" class="sm" style="fill: #c93030">margin-top: -30px</text>
  </g>

  <!-- Dimension bracket for overlap -->
  <g class="applied">
  <path d="M638 473 H665 M638 503 H665" stroke="#000000" stroke-width="1.8" />
  <path class="dim" d="M666 478 V498" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="683" y="480" class="numeric">30px</text>
  <text x="683" y="505" class="sm">重なる</text>
  </g>

  <!-- Bottom result -->
  <rect x="54" y="689" width="792" height="134" rx="13" fill="#fcf1e4"/>
  <text style="fill:#000000" fill="#000000" x="450" y="733" text-anchor="middle" class="heading">負のmargin同士は足し算しない</text>
  <g class="applied">
  <text x="450" y="775" text-anchor="middle" class="result">-20px と -30px → 相殺結果 -30px</text>
  <text x="450" y="803" text-anchor="middle" class="sm">絶対値が大きい方が結果になり、要素は30px重なる</text>
  </g>
<style>.cue-before{opacity:0}.cue-after{opacity:1}@media(prefers-reduced-motion:no-preference){.cue-before{animation:cue-before 25s steps(1,end) infinite}.cue-after{animation:cue-after 25s steps(1,end) infinite}@keyframes cue-before{0%,23.999994%{opacity:1}24.000000001%,100%{opacity:0}}@keyframes cue-after{0%,23.999994%{opacity:0}24.000000001%,100%{opacity:1}}}</style><g id="stage-caption" class="caption"><text class="cue-before" x="450" y="306" text-anchor="middle" fill="#000000" style="fill:#000000;font-family:Yu Gothic,Meiryo,sans-serif;font-size:18px;font-weight:700"><tspan x="450">AのbottomとBのtopの－marginで、Bが30px上へ</tspan></text><text class="cue-after" x="450" y="306" text-anchor="middle" fill="#000000" style="fill:#000000;font-family:Yu Gothic,Meiryo,sans-serif;font-size:18px;font-weight:700"><tspan x="450">移動後：箱が30px重なる</tspan></text></g><style>@media(prefers-reduced-motion:no-preference){.caption{animation:caption 25s linear infinite}@keyframes caption{0%{opacity:0}1%{opacity:0}2%{opacity:1}23.99996%{opacity:1}24%{opacity:0}25%{opacity:0}26%{opacity:1}100%{opacity:1}}}</style></g></g>
<text style="fill:#000000" x="56" y="73" class="title" fill="#000000">⑩ 負のmargin同士の相殺</text>
<g id="css"><text x="28" y="109" xml:space="preserve" style="font-family:Consolas,Meiryo,monospace;font-size:19px;font-weight:500;fill:#313539"><tspan x="28"><tspan fill="#4C764C" style="fill:#4C764C">/* 子A */</tspan><tspan fill="#313539" style="fill:#313539"> </tspan><tspan fill="#744047" style="fill:#744047">.a</tspan><tspan fill="#313539" style="fill:#313539"> { </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">margin-bottom</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">-20px</tspan><tspan fill="#313539" style="fill:#313539">; }</tspan></tspan><tspan x="28" dy="28"><tspan fill="#4C764C" style="fill:#4C764C">/* 子B */</tspan><tspan fill="#313539" style="fill:#313539"> </tspan><tspan fill="#744047" style="fill:#744047">.b</tspan><tspan fill="#313539" style="fill:#313539"> { </tspan><tspan fill="#AE3A42" style="fill:#AE3A42">margin-top</tspan><tspan fill="#313539" style="fill:#313539">: </tspan><tspan fill="#3B765B" style="fill:#3B765B">-30px</tspan><tspan fill="#313539" style="fill:#313539">; }</tspan></tspan></text></g>
</svg>
