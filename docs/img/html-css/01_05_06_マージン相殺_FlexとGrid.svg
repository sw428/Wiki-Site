<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 201 340 239" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Flex・Gridでは親子の上marginが相殺しない</title>
<desc id="desc">親をFlexまたはGridにした場合の模式図。親のmargin-top: 20pxは親の外側、子のmargin-top: 40pxは親の内側に別々に作用する。前の要素にはmarginがないため、その下端から子の上端までの距離は20pxと40pxを加えた60pxになる。オレンジはmarginの説明用の色で、実際の背景色ではない。灰色の実線は親の範囲を示す補助線で、実際のCSSのborderではない。</desc>
<rect x="0" y="222" width="340" height="218" fill="#ffffff"/>
<style>
    text { font-family: "Noto Sans CJK JP", "Yu Gothic", sans-serif; }
  </style>
<text x="12" y="239" font-size="14" font-weight="bold" fill="#000000">② Flex・Grid（相殺しない）</text>
  <rect x="60" y="250" width="242" height="38" fill="#cfe4ff" stroke="#315fa0"/>
  <text x="181" y="274" text-anchor="middle" font-size="12" fill="#315fa0">前の要素</text>
  <rect x="60" y="288" width="242" height="20" fill="#f9cc9d"/>
  <text x="181" y="300" text-anchor="middle" font-size="11" style="fill:#444444" fill="#444444">親margin 20px</text>
  <rect x="60" y="308" width="242" height="119" fill="#f5f5f5"/>
  <rect x="57.5" y="305.5" width="247" height="124" fill="none" stroke="#666666" stroke-dasharray="none" stroke-width="2" data-parent-boundary="true" data-outline-offset="2.5" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
  <line x1="57.5" y1="305.5" x2="304.5" y2="305.5" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.5" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
  <text x="53" y="311" text-anchor="end" font-size="10" fill="#444444">上端</text>
  <rect x="78" y="309" width="206" height="40" fill="#f9cc9d"/>
  <text x="181" y="334" text-anchor="middle" font-size="12" style="fill:#c93030" fill="#c93030">子margin 40px</text>
  <rect x="78" y="349" width="206" height="43" fill="#f8cfd6" stroke="#c93030"/>
  <text x="181" y="376" font-size="13" text-anchor="middle" fill="#c93030">子要素</text>
  <text x="181" y="417" font-size="12" text-anchor="middle" fill="#444444">親要素</text>
<g id="parent-boundary-note"><rect x="0" y="201" width="340" height="21" fill="#ffffff"/><text x="328" y="208.8" text-anchor="end" style="fill:#444444;font-family:Yu Gothic,Meiryo,sans-serif;font-size:6px;font-weight:400"><tspan x="328">※ 灰色の線はborderではなく、</tspan><tspan x="328" dy="9">親の範囲を示す補助線です。</tspan></text></g></svg>
