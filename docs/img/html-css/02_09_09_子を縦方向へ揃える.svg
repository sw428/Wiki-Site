<svg xmlns="http://www.w3.org/2000/svg" width="640" height="555.0" viewBox="0 0 640 555.0" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">横中央を保ち、縦も中央へ寄せる</title><desc id="desc">高さ90pxのセル内で高さ30pxの子を上端から縦中央へ寄せる。横中央の指定は保つ。 指定変更の説明を表示して2.5秒以上待ち、3秒で変化させる。結果の静止時間を取り、元へ戻す。20秒周期。動きを減らす設定では指定後を静止表示。 説明は1・2の順で表示する。変更するCSSは1秒で消し、0.25秒空けて次の指定を1秒で表示し、表示完了後2.5秒待って3秒で図を変える。 1は変更前の値を矢印なしで表示し、2以降は変更前の値を矢印の左、変更後の値を右に示す。CSSと値の表示をそろえ、表示完了から2.5秒待ち、3秒で図を変える。結果を保った後、22秒で変更前の状態へ即座にリセットする。戻るアニメーションは行わない。動きを減らす設定では変更後を静止表示する。</desc>
