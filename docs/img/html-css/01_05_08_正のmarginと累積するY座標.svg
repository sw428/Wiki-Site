<rect x="625" y="295" width="210" height="112" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="730" y="359" font-size="23" text-anchor="middle" font-weight="700" fill="#c93030">子B .b</text>
<line x1="835" y1="295" x2="855" y2="295" stroke="#000000" stroke-width="1.5"/>
<text x="872" y="302" font-size="21" fill="#000000" >Y = 135px</text>
