<svg xmlns="http://www.w3.org/2000/svg" width="760" height="569.67" viewBox="0 -56 1150 862" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">正のmargin：隣同士の間隔と累積するY座標</title><desc id="desc">通常フローの同じブロック配置を二つの見方で示す。各箱の高さは112px。左は兄弟間の相殺後の間隔23、39、28pxをオレンジで示し、黒い両矢印で測る。右は子Aの上端をY=0とし、AからDの上端の座標0、135、286、426pxを示す。子Dまでの距離は前の三つの箱の高さと相殺後の三つの間隔の合計426px。親の灰色実線と箱の外枠は説明用で、実際のCSSのborderではない。縦の寸法は指定値に対応させ、横幅は模式的に示す。</desc><style>text{font-family:"Yu Gothic","Meiryo",sans-serif}</style><defs><marker id="measure" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" viewBox="0 0 10 10" refX="9" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.5"/></marker></defs><rect width="1150" height="806" fill="white"/>
<text x="575" y="39" font-size="29" text-anchor="middle" font-weight="700" fill="#000000">正のmargin：間隔とY座標</text>
<text x="50" y="88" font-size="25" font-weight="700" fill="#000000">① 隣同士の間隔</text>
<text x="600" y="88" font-size="25" font-weight="700" fill="#000000">② 基準からのY座標</text>
<text style="fill:#000000" x="70" y="123" font-size="19" fill="#000000" >各箱の高さ：112px</text>
<text style="fill:#000000" x="625" y="123" font-size="19" fill="#000000" >子Aの上端を Y = 0 とする</text>
<text x="55" y="146" font-size="17" fill="#444444" >親の範囲</text>
<rect x="50" y="160" width="440" height="538" fill="#f5f5f5"/><rect x="47" y="157" width="446" height="544" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="3" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<rect x="70" y="272" width="210" height="23" fill="#f9cc9d"/>
