<line x1="835" y1="446" x2="855" y2="446" stroke="#000000" stroke-width="1.5"/>
<text x="872" y="453" font-size="21" fill="#000000" >Y = 286px</text>
<rect x="625" y="586" width="210" height="112" fill="#fbe0eb" stroke="#be185d" stroke-width="2"/>
<text x="730" y="650" font-size="23" text-anchor="middle" font-weight="700" fill="#be185d">子D .d</text>
<line x1="835" y1="586" x2="855" y2="586" stroke="#000000" stroke-width="1.5"/>
<text x="872" y="593" font-size="21" fill="#000000" >Y = 426px</text>
<line x1="1070" y1="160" x2="1070" y2="586" stroke="#000000" stroke-width="1.5" marker-start="url(#measure)" marker-end="url(#measure)"/>
<text x="1098" y="373" font-size="19" fill="#000000" text-anchor="middle" transform="rotate(-90 1098 373)">A → D：426px</text>
<text x="575" y="746" font-size="25" fill="#000000" text-anchor="middle" font-weight="700">Y(D) = 112 × 3 + 23 + 39 + 28 = 426px</text>
<text style="fill:#000000" x="575" y="789" font-size="18" fill="#000000" text-anchor="middle">オレンジ＝相殺後のmargin　灰色の実線＝親の範囲</text>
<g id="parent-boundary-note"><rect x="0" y="-56" width="1150" height="56" fill="#ffffff"/><text x="1134" y="-35.2" text-anchor="end" style="fill:#444444;font-family:Yu Gothic,Meiryo,sans-serif;font-size:16px;font-weight:400"><tspan x="1134">※ 灰色の線はborderではなく、</tspan><tspan x="1134" dy="24">親の範囲を示す補助線です。</tspan></text></g></svg>