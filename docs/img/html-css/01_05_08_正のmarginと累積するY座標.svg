<rect x="70" y="295" width="210" height="112" fill="#f8cfd6" stroke="#c93030" stroke-width="2"/>
<text x="175" y="359" font-size="23" text-anchor="middle" font-weight="700" fill="#c93030">子B .b</text>
<line x1="298" y1="407" x2="298" y2="446" stroke="#000000" stroke-width="1.5" marker-start="url(#measure)" marker-end="url(#measure)"/>
<text x="315" y="432.5" font-size="18" fill="#000000" >39px</text>
<rect x="70" y="558" width="210" height="28" fill="#f9cc9d"/>
<rect x="70" y="446" width="210" height="112" fill="#e9ddff" stroke="#7c3aed" stroke-width="2"/>
