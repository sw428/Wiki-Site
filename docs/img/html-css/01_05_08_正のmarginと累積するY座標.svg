<text x="605" y="146" font-size="17" fill="#444444" >親の範囲</text>
<rect x="600" y="160" width="440" height="538" fill="#f5f5f5"/><rect x="597" y="157" width="446" height="544" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="3" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<rect x="625" y="272" width="210" height="23" fill="#f9cc9d"/>
<rect x="625" y="160" width="210" height="112" fill="#cfe4ff" stroke="#315fa0" stroke-width="2"/>
