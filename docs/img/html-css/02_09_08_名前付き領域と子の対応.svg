<svg xmlns="http://www.w3.org/2000/svg" width="640" height="634.0" viewBox="0 0 640 634.0" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">名前付き領域を、子へ割り当てる</title><desc id="desc">親のgrid-template-areasはhead head、side mainの2行。headは2列をまたぐ長方形。子.headerのgrid-area:head、.sideのside、.mainのmainがそれぞれの領域へ対応する。親幅510pxで左列150px、gap30px、右列330px。行高は模式表示。</desc><metadata id="grid-data">{"type":"static","parentWidth":510,"leftColumn":150,"rightColumn":330,"gap":30,"areas":[{"name":"head","selector":".header","x":48.0,"y":354.0,"w":510.0,"h":64.0,"fill":"#f8cfd6","stroke":"#c93030"},{"name":"side","selector":".side","x":48.0,"y":448.0,"w":149.2682926829268,"h":112.0,"fill":"#cfe4ff","stroke":"#315fa0"},{"name":"main","selector":".main","x":228.36585365853657,"y":448.0,"w":329.6341463414634,"h":112.0,"fill":"#f3dcf7","stroke":"#a21caf"}]}</metadata><style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:23px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.small{font-size:18px}.parent-label{fill:#444444}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.status{fill:#000000}.track{fill:none;stroke:#007F99;stroke-width:1.5}.edge{stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.code .active-css{fill:#c93030}.gap-region{fill:#ECE5FF;stroke:none}.parent-note{font-size:12px;fill:#000000}</style><rect width="640" height="634.0" fill="#fff" /><text x="24" y="34" class="title">名前付き領域を、子へ割り当てる</text><text x="24" y="96.0" class="code">.parent {</text><text x="24" y="121.0" class="code">  <tspan class="active-css">grid-template-areas:</tspan></text><text x="24" y="146.0" class="code">    <tspan class="active-css">"head head"</tspan></text><text x="24" y="171.0" class="code">    <tspan class="active-css">"side main";</tspan></text><text x="24" y="196.0" class="code">}</text><text x="24" y="242.0" class="code">.header { <tspan class="active-css">grid-area: head;</tspan> }</text><text x="24" y="268.0" class="code">.side   { <tspan class="active-css">grid-area: side;</tspan> }</text><text x="24" y="294.0" class="code">.main   { <tspan class="active-css">grid-area: main;</tspan> }</text><text x="48" y="337.0" class="small parent-label">親：内容幅510px</text><rect x="48.0" y="354.0" width="510.0" height="206.0" fill="#f5f5f5" /><rect x="48.0" y="418.0" width="510.0" height="30.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="197.26829268" y="448.0" width="31.09756098" height="112.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="48.0" y="354.0" width="510.0" height="64.0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="60.43902439" y="380.0" class="" style="fill:#c93030">.header</text><text x="60.43902439" y="405.0" class="small" style="fill:#c93030">head</text><rect x="48.0" y="448.0" width="149.26829268" height="112.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="60.43902439" y="474.0" class="" style="fill:#315fa0">.side</text><text x="60.43902439" y="499.0" class="small" style="fill:#315fa0">side</text><rect x="228.36585366" y="448.0" width="329.63414634" height="112.0" fill="#f3dcf7" stroke="#a21caf" stroke-width="1.5" /><text x="240.80487805" y="474.0" class="" style="fill:#a21caf">.main</text><text x="240.80487805" y="499.0" class="small" style="fill:#a21caf">main</text><text x="24" y="600.0" class="small">親が領域を定義し、子がgrid-areaで名前を使う。</text><rect x="45.25" y="351.25" width="515.5" height="211.5" fill="none" class="edge" data-parent-boundary="true" data-outline-offset="2.75" data-outline-gap="1" /><g class="parent-note-block" data-layout-shift="24"><text x="400" y="65" class="parent-note">※ 灰色の線はborderではなく、</text><text x="400" y="83" class="parent-note">親の範囲を示す補助線です。</text></g></svg>
