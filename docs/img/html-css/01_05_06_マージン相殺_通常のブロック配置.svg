<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 -21 340 239" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">通常のブロック配置で親子の上marginが相殺する</title>
<desc id="desc">通常フローのブロック配置で、親と最初の子の上marginが相殺する条件を満たす例。親のmargin-top: 20pxと子のmargin-top: 40pxが相殺し、親の外側に40pxの余白ができる。前の要素にはmarginがないため、その下端から親と子の上端まで40pxになり、親と子の上端はそろう。オレンジはmarginの説明用の色で、実際の背景色ではない。灰色の実線は親の範囲を示す補助線で、実際のCSSのborderではない。寸法と配置は模式的に示す。</desc>
<rect x="0" y="0" width="340" height="218" fill="#ffffff"/>
<style>
    text { font-family: "Noto Sans CJK JP", "Yu Gothic", sans-serif; }
  </style>
<text x="12" y="20" font-size="14" font-weight="bold" fill="#000000">① 通常のブロック配置（相殺する）</text>
  <rect x="60" y="31" width="242" height="38" fill="#cfe4ff" stroke="#315fa0"/>
  <text x="181" y="55" text-anchor="middle" font-size="12" fill="#315fa0">前の要素</text>
  <rect x="60" y="69" width="242" height="40" fill="#f9cc9d"/>
  <text x="181" y="92" text-anchor="middle" font-size="12" fill="#8A581B" style="fill: #000000">40px（相殺結果）</text>
  <rect x="60" y="109" width="242" height="88" fill="#f5f5f5"/>
  <rect x="57.5" y="106.5" width="247" height="93" fill="none" stroke="#666666" stroke-dasharray="none" stroke-width="2" data-parent-boundary="true" data-outline-offset="2.5" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
  <line x1="57.5" y1="106.5" x2="304.5" y2="106.5" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="2.5" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
  <text x="53" y="112" text-anchor="end" font-size="10" fill="#444444">上端</text>
  <rect x="78" y="109" width="206" height="43" fill="#f8cfd6" stroke="#c93030"/>
  <text x="181" y="135" font-size="13" text-anchor="middle" fill="#c93030">子要素</text>
  <text x="181" y="182" font-size="12" text-anchor="middle" fill="#444444">親要素</text>
  <g id="parent-boundary-note"><rect x="0" y="-21" width="340" height="21" fill="#ffffff"/><text x="328" y="-13.2" text-anchor="end" style="fill:#444444;font-family:Yu Gothic,Meiryo,sans-serif;font-size:6px;font-weight:400"><tspan x="328">※ 灰色の線はborderではなく、</tspan><tspan x="328" dy="9">親の範囲を示す補助線です。</tspan></text></g></svg>
