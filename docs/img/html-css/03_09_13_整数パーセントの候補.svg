<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">3列で、整数%になる候補を比べる</title><desc id="desc">各帯の幅は100%。列幅32%とgap2%ではgap合計4%、列幅30%とgap5%では10%、列幅29%とgap6.5%では13%。gap合計4・10・13は3で割ると1余るが、1箇所のgapは整数とは限らない。</desc><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#000000}.heading{font-size:25px;font-weight:700}.body{font-size:21px}.sub{font-size:19px}.note{font-size:14px}.column{font-size:23px;fill:#007F99}.gap{font-size:20px;fill:#7C3AED}.parent{font-size:20px;fill:#444444}.math{font-size:23px}.label{font-size:22px;font-weight:700}</style><rect width="760" height="600" fill="#ffffff"/><text x="32" y="42" class="heading" text-anchor="start">3列で、整数%になる候補を比べる</text><text x="728" y="72" class="note" text-anchor="end">※ 灰色の線はborderではなく、親の範囲を示す補助線です。</text><text x="70" y="112" class="label" text-anchor="start">列幅32%：gap合計4% → 1箇所は2%</text><g class="band" data-n="3" data-gap="2" data-column="32" data-width="620"><rect x="68" y="127" width="624" height="62" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><rect class="track" data-start="70" data-width="198.4" x="71" y="130" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="169.2" y="166" class="column" text-anchor="middle">32%</text><rect class="gutter" x="268.4" y="129" width="12.4" height="58" fill="#ECE5FF" stroke="none"/><path d="M 274.59999999999997 190 v 14" stroke="#7C3AED" fill="none"/><text x="274.59999999999997" y="229" class="gap" text-anchor="middle">2%</text><rect class="track" data-start="280.8" data-width="198.4" x="281.8" y="130" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="380" y="166" class="column" text-anchor="middle">32%</text><rect class="gutter" x="479.20000000000005" y="129" width="12.4" height="58" fill="#ECE5FF" stroke="none"/><path d="M 485.40000000000003 190 v 14" stroke="#7C3AED" fill="none"/><text x="485.40000000000003" y="229" class="gap" text-anchor="middle">2%</text><rect class="track" data-start="491.6" data-width="198.4" x="492.6" y="130" width="196.4" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="590.8000000000001" y="166" class="column" text-anchor="middle">32%</text></g><text x="70" y="269" class="label" text-anchor="start">列幅30%：gap合計10% → 1箇所は5%</text><g class="band" data-n="3" data-gap="5" data-column="30" data-width="620"><rect x="68" y="284" width="624" height="62" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><rect class="track" data-start="70" data-width="186" x="71" y="287" width="184" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="163" y="323" class="column" text-anchor="middle">30%</text><rect class="gutter" x="256" y="286" width="31" height="58" fill="#ECE5FF" stroke="none"/><path d="M 271.5 347 v 14" stroke="#7C3AED" fill="none"/><text x="271.5" y="386" class="gap" text-anchor="middle">5%</text><rect class="track" data-start="287" data-width="186" x="288" y="287" width="184" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="380" y="323" class="column" text-anchor="middle">30%</text><rect class="gutter" x="473" y="286" width="31" height="58" fill="#ECE5FF" stroke="none"/><path d="M 488.5 347 v 14" stroke="#7C3AED" fill="none"/><text x="488.5" y="386" class="gap" text-anchor="middle">5%</text><rect class="track" data-start="504" data-width="186" x="505" y="287" width="184" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="597" y="323" class="column" text-anchor="middle">30%</text></g><text x="70" y="426" class="label" text-anchor="start">列幅29%：gap合計13% → 1箇所は6.5%</text><g class="band" data-n="3" data-gap="6.5" data-column="29" data-width="620"><rect x="68" y="441" width="624" height="62" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><rect class="track" data-start="70" data-width="179.8" x="71" y="444" width="177.8" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="159.9" y="480" class="column" text-anchor="middle">29%</text><rect class="gutter" x="249.8" y="443" width="40.3" height="58" fill="#ECE5FF" stroke="none"/><path d="M 269.95 504 v 14" stroke="#7C3AED" fill="none"/><text x="269.95" y="543" class="gap" text-anchor="middle">6.5%</text><rect class="track" data-start="290.1" data-width="179.8" x="291.1" y="444" width="177.8" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="380" y="480" class="column" text-anchor="middle">29%</text><rect class="gutter" x="469.90000000000003" y="443" width="40.3" height="58" fill="#ECE5FF" stroke="none"/><path d="M 490.05 504 v 14" stroke="#7C3AED" fill="none"/><text x="490.05" y="543" class="gap" text-anchor="middle">6.5%</text><rect class="track" data-start="510.20000000000005" data-width="179.8" x="511.20000000000005" y="444" width="177.8" height="56" fill="#cfe4ff" stroke="#007F99" stroke-width="2"/><text x="600.1" y="480" class="column" text-anchor="middle">29%</text></g><text x="380" y="582" class="sub" text-anchor="middle">列幅が整数でも、1箇所のgapは小数になることがある。</text></svg>
