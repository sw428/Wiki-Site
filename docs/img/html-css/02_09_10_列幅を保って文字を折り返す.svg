<svg xmlns="http://www.w3.org/2000/svg" width="640" height="528" viewBox="0 0 640 528.0" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">列幅と、文字の折り返しを分ける</title><desc id="desc">同じ列幅のままoverflow-wrap:anywhereで改行可能な位置を加える。文字を縮小する指定ではない。改行位置は模式表示。</desc>
<metadata id="grid-data">{"type":"static","schematic":true,"states":[{"width":510,"height":40,"rows":[40],"gapx":30,"gapy":30,"items":[{"id":"A","x":0,"y":0,"w":240,"h":40},{"id":"B","x":270,"y":0,"w":240,"h":40}]},{"width":510,"height":100,"rows":[100],"gapx":30,"gapy":30,"items":[{"id":"A","x":0,"y":0,"w":240,"h":100},{"id":"B","x":270,"y":0,"w":240,"h":100}]}]}</metadata>
<style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:23px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.small{font-size:18px}.parent-label{fill:#444444}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.status{fill:#000000}.track{fill:none;stroke:#007F99;stroke-width:1.5}.edge{stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.code .active-css{fill:#c93030}.gap-region{fill:#ECE5FF;stroke:none}.parent-note{font-size:12px;fill:#000000}</style><rect width="640" height="528.0" fill="#ffffff" />
<text x="24" y="34" class="title">列幅と、文字の折り返しを分ける</text>
<text x="24" y="96.0" class="code" xml:space="preserve">.token {</text><text x="24" y="121.0" class="code" xml:space="preserve">  <tspan class="active-css">overflow-wrap: anywhere;</tspan></text><text x="24" y="146.0" class="code" xml:space="preserve">}</text><text x="24" y="202.0">指定前：列は収まっても文字がはみ出す</text><rect fill="#f5f5f5" x="48.0" y="224.0" width="510.0" height="40.0" /><rect class="gap-region" fill="#ECE5FF" stroke="none" x="288.0" y="224.0" width="30.0" height="40.0" /><rect data-child="A" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" x="48.0" y="224.0" width="240" height="40" /><rect data-child="B" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" x="318.0" y="224.0" width="240" height="40" /><text x="58.38961039" y="251.77777778" class="small" textLength="390" lengthAdjust="spacingAndGlyphs">LONG_UNBROKEN_TEXT_0123456789</text><text x="24" y="330.0">指定後：同じ列幅の中で文字を折り返す</text><rect fill="#f5f5f5" x="48.0" y="352.0" width="510.0" height="100.0" /><rect class="gap-region" fill="#ECE5FF" stroke="none" x="288.0" y="352.0" width="30.0" height="100.0" /><rect data-child="A" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" x="48.0" y="352.0" width="240" height="100" /><rect data-child="B" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" x="318.0" y="352.0" width="240" height="100" /><text x="58.38961039" y="377.0" class="small">LONG_UNBROKEN_</text><text x="58.38961039" y="405.0" class="small">TEXT_0123456789</text><text x="24" y="496.0" class="small">改行位置と行高は模式表示。列幅は変えていない。</text>
