<svg xmlns="http://www.w3.org/2000/svg" width="640" height="516.0" viewBox="0 0 640 516.0" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">列線2から、子Aを1列分置く</title><desc id="desc">3列各150pxとgap30px、同じ子A〜F。Aだけgrid-column:2にする。通常のrowによる自動配置で、1行目は空き・A・B、2行目はC・D・E、3行目はFとなる。1〜4は列線の番号。gapを持つ列線は開始側の代表位置で表示。親と列の補助線は実際のCSSのborderではない。</desc><metadata id="grid-data">{"type":"static","parentWidth":510,"columnWidth":150,"gap":30,"flow":"row","items":[{"id":"A","row":0,"col":1},{"id":"B","row":0,"col":2},{"id":"C","row":1,"col":0},{"id":"D","row":1,"col":1},{"id":"E","row":1,"col":2},{"id":"F","row":2,"col":0}]}</metadata><style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:23px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.small{font-size:18px}.parent-label{fill:#444444}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.status{fill:#000000}.track{fill:none;stroke:#007F99;stroke-width:1.5}.edge{stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.code .active-css{fill:#c93030}.gap-region{fill:#ECE5FF;stroke:none}.parent-note{font-size:12px;fill:#000000}</style><rect width="640" height="516.0" fill="#fff" /><text x="24" y="34" class="title">列線2から、子Aを1列分置く</text><text x="24" y="96.0" class="code">.target {</text><text x="24" y="121.0" class="code">  <tspan class="active-css">grid-column: 2;</tspan></text><text x="24" y="146.0" class="code">}</text><text x="48" y="193.0" class="small parent-label">親：内容幅510px</text><rect x="48.0" y="238.0" width="510.0" height="180.0" fill="#f5f5f5" /><rect x="196.96551724" y="238.0" width="31.03448276" height="180.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="378.0" y="238.0" width="30.0" height="180.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="48.0" y="278.0" width="510.0" height="30.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="48.0" y="348.0" width="510.0" height="30.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="48.0" y="238.0" width="148.96551724" height="180.0" class="track" /><rect x="228.0" y="238.0" width="150.0" height="180.0" class="track" /><rect x="408.0" y="238.0" width="150.0" height="180.0" class="track" /><text x="48" y="222.0" class="small column" text-anchor="middle">1</text><text x="228" y="222.0" class="small column" text-anchor="middle">2</text><text x="408" y="222.0" class="small column" text-anchor="middle">3</text><text x="558" y="222.0" class="small column" text-anchor="middle">4</text><rect data-child="A" x="228.0" y="238.0" width="150" height="40" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="238.41666667" y="265.77777778" class="" style="fill:#c93030">A</text><rect data-child="B" x="408.0" y="238.0" width="150" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="418.41666667" y="265.77777778" class="" style="fill:#315fa0">B</text><rect data-child="C" x="48.0" y="308.0" width="150" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="58.34482759" y="335.77777778" class="" style="fill:#315fa0">C</text><rect data-child="D" x="228.0" y="308.0" width="150" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="238.41666667" y="335.77777778" class="" style="fill:#315fa0">D</text><rect data-child="E" x="408.0" y="308.0" width="150" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="418.41666667" y="335.77777778" class="" style="fill:#315fa0">E</text><rect data-child="F" x="48.0" y="378.0" width="150" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="58.34482759" y="405.77777778" class="" style="fill:#315fa0">F</text><text x="101.79310345" y="265.77777778" class="small">空き</text><text x="24" y="459.0" class="small">数字は列線。Aは列線2から1列分を使う。</text><text x="24" y="487.0" class="small">この自動配置では、先頭の空きへ戻って詰めない。</text><rect x="45.25" y="235.25" width="515.5" height="185.5" fill="none" class="edge" data-parent-boundary="true" data-outline-offset="2.75" data-outline-gap="1" /><g class="parent-note-block" data-layout-shift="24"><text x="400" y="65" class="parent-note">※ 灰色の線はborderではなく、</text><text x="400" y="83" class="parent-note">親の範囲を示す補助線です。</text></g></svg>
