<svg xmlns="http://www.w3.org/2000/svg" width="640" height="766.0" viewBox="0 0 640 766.0" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">余白を作る場所を比べる</title><desc id="desc">同じ2列2行で親の外側寸法330px×110pxをそろえる。親のgap30pxはトラック間、親のpadding20pxは内周、各子のmargin10pxは子の外周に空間を作る。各指定を単独で使う模式図。子に色を付け、余白の担当を紫・緑・オレンジで区別する。</desc><metadata id="grid-data">{"type":"static","parent":{"width":330,"height":110},"gap":30,"padding":20,"margin":10}</metadata><style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:23px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.small{font-size:18px}.parent-label{fill:#444444}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.status{fill:#000000}.track{fill:none;stroke:#007F99;stroke-width:1.5}.edge{stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.code .active-css{fill:#c93030}.gap-region{fill:#ECE5FF;stroke:none}.parent-note{font-size:12px;fill:#000000}</style><rect width="640" height="766.0" fill="#fff" /><text x="24" y="34" class="title">余白を作る場所を比べる</text><text x="24" y="96.0" class="code">.parent { display: grid;</text><text x="24" y="122.0" class="code">  grid-template-columns: 1fr 1fr; }</text><text x="24.0" y="185.0" class="title">gap</text><text x="24" y="217.0" class="code">.parent {</text><text x="24" y="243.0" class="code">  <tspan class="active-css">gap: 30px;</tspan></text><text x="24" y="269.0" class="code">}</text><text x="24" y="301.0" class="small">親のトラック間</text><text x="270" y="167.0" class="small parent-label">親：330 × 110px</text><rect x="270.0" y="181.0" width="330.0" height="110.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="270.0" y="181.0" width="330.0" height="110.0" fill="#f5f5f5" /><rect x="420.0" y="181.0" width="30.0" height="110.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="270.0" y="221.0" width="330.0" height="30.0" fill="#ECE5FF" class="gap-region" stroke="none" /><rect x="270.0" y="181.0" width="150.0" height="40.0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="280.41666667" y="206.0" class="">A</text><rect x="450.0" y="181.0" width="150.0" height="40.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="460.41666667" y="206.0" class="">B</text><rect x="270.0" y="251.0" width="150.0" height="40.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="280.41666667" y="276.0" class="">C</text><rect x="450.0" y="251.0" width="150.0" height="40.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="460.41666667" y="276.0" class="">D</text><text x="24.0" y="368.44444444" class="title">padding</text><text x="24" y="400.0" class="code">.parent {</text><text x="24" y="426.0" class="code">  <tspan class="active-css">padding: 20px;</tspan></text><text x="24" y="452.0" class="code">}</text><text x="24" y="484.0" class="small">親の内側の端</text><text x="270" y="350.0" class="small parent-label">親：330 × 110px</text><rect x="270.0" y="364.0" width="330.0" height="110.0" fill="#cae6d1" /><rect x="290.0" y="384.0" width="290.0" height="70.0" fill="#f5f5f5" /><rect x="290.0" y="384.0" width="145.0" height="35.0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="300.28368794" y="407.64864865" class="">A</text><rect x="435.0" y="384.0" width="145.0" height="35.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="445.28368794" y="407.64864865" class="">B</text><rect x="290.0" y="419.0" width="145.0" height="35.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="300.28368794" y="442.64864865" class="">C</text><rect x="435.0" y="419.0" width="145.0" height="35.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="445.28368794" y="442.64864865" class="">D</text><text x="24.0" y="551.44444444" class="title">margin</text><text x="24" y="583.0" class="code">.child {</text><text x="24" y="609.0" class="code">  <tspan class="active-css">margin: 10px;</tspan></text><text x="24" y="635.0" class="code">}</text><text x="24" y="667.0" class="small">それぞれの子の外側</text><text x="270" y="533.0" class="small parent-label">親：330 × 110px</text><rect x="270.0" y="547.0" width="330.0" height="110.0" fill="#f9cc9d" /><rect x="280.0" y="557.0" width="145.0" height="35.0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="290.28368794" y="580.64864865" class="">A</text><rect x="445.0" y="557.0" width="145.0" height="35.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="455.28368794" y="580.64864865" class="">B</text><rect x="280.0" y="612.0" width="145.0" height="35.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="290.28368794" y="635.64864865" class="">C</text><rect x="445.0" y="612.0" width="145.0" height="35.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="455.28368794" y="635.64864865" class="">D</text><text x="24" y="746.0" class="small">各指定を単独で使用。余白の着色と親の線は説明用。</text><rect x="267.25" y="178.25" width="335.5" height="115.5" fill="none" class="edge" data-parent-boundary="true" data-outline-offset="2.75" data-outline-gap="1" /><rect x="267.25" y="361.25" width="335.5" height="115.5" fill="none" class="edge" data-parent-boundary="true" data-outline-offset="2.75" data-outline-gap="1" /><rect x="267.25" y="544.25" width="335.5" height="115.5" fill="none" class="edge" data-parent-boundary="true" data-outline-offset="2.75" data-outline-gap="1" /><g class="parent-note-block" data-layout-shift="24"><text x="400" y="65" class="parent-note">※ 灰色の線はborderではなく、</text><text x="400" y="83" class="parent-note">親の範囲を示す補助線です。</text></g></svg>
