<title id="title">② 列を2本にする</title><desc id="desc">親幅510pxのまま、幅150pxの列を2本指定する。gapはまだない。 指定変更の説明を表示して2.5秒以上待ち、3秒で変化させる。結果の静止時間を取り、元へ戻す。20秒周期。動きを減らす設定では指定後を静止表示。 説明は1・2の順で表示する。変更するCSSは1秒で消し、0.25秒空けて次の指定を1秒で表示し、表示完了後2.5秒待って3秒で図を変える。</desc>
