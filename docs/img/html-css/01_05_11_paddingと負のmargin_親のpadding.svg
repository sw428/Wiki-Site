<svg xmlns="http://www.w3.org/2000/svg" width="668.18" height="600" viewBox="0 -60 980 880" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">親のpadding-topで負のmargin指定前の子の位置を確認する</title>
<desc id="desc">前の要素の下端を0pxとし、そのmargin-bottom: 250pxの先で親が始まる。親のpadding-top: 100pxを緑の領域と寸法で示し、負のmarginがない子の上端は250pxに100pxを加えた350pxになる。通常フローのブロック配置で、ほかのmarginやborder、位置指定がこの距離に影響しない例。縦の距離はCSSの1pxを図の0.8単位で示し、箱の大きさは模式的で親の下側は省略する。灰色の実線は親の範囲を示す補助線で、実際のCSSのborderではない。</desc>
<defs>
<marker id="black" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#000000" stroke-width="2"/>
</marker>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#315fa0" stroke-width="2"/>
</marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#26724a" stroke-width="2"/>
</marker>
<marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#c93030" stroke-width="2"/>
</marker>
</defs>
<g font-family="Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
<rect x="0" y="0" width="980" height="820" fill="#ffffff" />
<rect x="30" y="20" width="920" height="94" fill="#f1f5f9" />
<text x="52" y="61" font-size="35" font-weight="700" text-anchor="start" fill="#000000">② 親のpadding-top</text>
<text x="52" y="96" font-size="25" font-weight="400" text-anchor="start" fill="#26724a">.parent { padding: 100px 30px; }</text>
<rect x="180" y="140" width="400" height="80" fill="#cfe4ff" stroke="#315fa0" stroke-width="2" />
<text x="380" y="190" font-size="29" font-weight="700" text-anchor="middle" fill="#315fa0">前の要素 .before</text>
<rect x="180" y="220" width="400" height="200" fill="#f9cc9d" />
<rect x="180" y="420" width="400" height="280" fill="#f5f5f5" />
<rect x="180" y="420" width="400" height="80" fill="#cae6d1" />
<line x1="177" y1="417" x2="583" y2="417" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="3" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<line x1="177" y1="417" x2="177" y2="703" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="3" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<line x1="583" y1="417" x2="583" y2="703" stroke="#666666" stroke-width="2" stroke-dasharray="none" data-parent-boundary="true" data-outline-offset="3" data-outline-gap="1" style="stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none"/>
<text x="380" y="664" font-size="27" fill="#444444" font-weight="700" text-anchor="middle">親要素 .parent</text>
<text x="380" y="693" font-size="20" font-weight="400" text-anchor="middle" fill="#000000">↓ 下へ続く</text>
<line x1="165" y1="220" x2="615" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
<text style="fill:#000000" x="710" y="227" font-size="22" fill="#000000" font-weight="400" text-anchor="start">前の要素の下端：0px</text>
<text x="710" y="427" font-size="22" fill="#444444" font-weight="400" text-anchor="start">親の上端：250px</text>
<text x="380" y="328" font-size="25" fill="#315fa0" font-weight="600" text-anchor="middle">margin-bottom: 250px</text>
<text x="380" y="468" font-size="25" fill="#26724a" font-weight="600" text-anchor="middle">padding-top: 100px</text>
<line x1="130" y1="420" x2="130" y2="500" stroke="#26724a" stroke-width="3" marker-start="url(#green)" marker-end="url(#green)"/>
<text x="115" y="470" font-size="24" fill="#26724a" font-weight="700" text-anchor="end">100px</text>
<rect x="235" y="500" width="290" height="80" fill="#f8cfd6" stroke="#e6586b" stroke-width="2" />
<text x="380" y="552" font-size="28" font-weight="700" text-anchor="middle" fill="#c93030">子要素 .child</text>
<text x="710" y="507" font-size="22" fill="#000000" font-weight="400" text-anchor="start" style="fill:#000000">子の上端：350px</text>
<text style="fill:#000000" x="710" y="540" font-size="21" fill="#000000" font-weight="400" text-anchor="start">（負のmarginなし）</text>
<rect x="30" y="716" width="920" height="53" fill="#f1f5f9" />
<text x="490" y="753" font-size="31" fill="#000000" font-weight="700" text-anchor="middle" style="fill:#000000">250 + 100 = 350px</text>
<text style="fill:#000000" x="40" y="798" font-size="20" fill="#000000" font-weight="400" text-anchor="start">実線は親の補助線で、CSSのborderではありません。図は模式図です。</text>
</g>
<g id="parent-boundary-note"><rect x="0" y="-60" width="980" height="60" fill="#ffffff"/><text x="963" y="-37.9" text-anchor="end" style="fill:#444444;font-family:Yu Gothic,Meiryo,sans-serif;font-size:17px;font-weight:400"><tspan x="963">※ 灰色の線はborderではなく、</tspan><tspan x="963" dy="25.5">親の範囲を示す補助線です。</tspan></text></g></svg>
