<svg xmlns="http://www.w3.org/2000/svg" width="451.76" height="600" viewBox="0 0 640 850" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">1行目と3行目の高さを指定する</title>
<desc id="desc">2列に子A〜Hを並べる。grid-template-rows: 100px auto 120pxで1〜3行目を明示し、2行目は短い1行の内容とline-height: 40pxにより40pxになる。4行目は自動で追加され、grid-auto-rows: 80pxが適用される。2行目のautoはgrid-auto-rowsの担当ではない。親のheightは指定せず、padding・borderはない。親の内容高さは行高の合計と3か所のgapから430pxになる。親の灰色の実線は説明用の補助線。</desc>
<metadata id="grid-data">{"type":"static","width":330,"height":430,"rows":[100,40,120,80],"gap":30,"explicitRows":3,"implicitRows":1,"items":[{"id":"A","x":0,"y":0,"w":150,"h":100},{"id":"B","x":180,"y":0,"w":150,"h":100},{"id":"C","x":0,"y":130,"w":150,"h":40},{"id":"D","x":180,"y":130,"w":150,"h":40},{"id":"E","x":0,"y":200,"w":150,"h":120},{"id":"F","x":180,"y":200,"w":150,"h":120},{"id":"G","x":0,"y":350,"w":150,"h":80},{"id":"H","x":180,"y":350,"w":150,"h":80}],"plot":{"x":48,"y":350}}</metadata>
<style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:23px;font-weight:700}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.active-css{fill:#c93030}.small{font-size:18px}.row{fill:#D66A00}.parent-label{fill:#444444}.parent-note{font-size:12px}.edge{fill:none;stroke:#666666;stroke-width:2;stroke-dasharray:none}</style>
<rect width="640" height="850" fill="#ffffff"/>
<text x="24" y="34" class="title">1行目と3行目の高さを指定する</text>
<text x="400" y="65" class="parent-note">※ 灰色の線はborderではなく、</text>
<text x="400" y="83" class="parent-note">親の範囲を示す補助線です。</text>
<text x="24" y="104" class="code" xml:space="preserve">.parent {</text>
<text x="24" y="128" class="code" xml:space="preserve">  display: grid;</text>
<text x="24" y="152" class="code" xml:space="preserve">  width: 330px;</text>
<text x="24" y="176" class="code" xml:space="preserve">  grid-template-columns: 150px 150px;</text>
<text x="24" y="200" class="code" xml:space="preserve"><tspan class="active-css">  grid-template-rows: 100px auto 120px;</tspan></text>
<text x="24" y="224" class="code" xml:space="preserve"><tspan class="active-css">  grid-auto-rows: 80px;</tspan></text>
<text x="24" y="248" class="code" xml:space="preserve">  gap: 30px;</text>
<text x="24" y="272" class="code" xml:space="preserve">}</text>
<text x="24" y="300" class="small">1〜3行目は明示行。4行目は追加された行。</text>
<text x="48" y="330" class="small parent-label">親：height指定なし（内容幅330px）</text>
<rect x="48" y="350" width="330" height="430" fill="#f5f5f5"/>
<rect x="198" y="350" width="30" height="430" fill="#ECE5FF" stroke="none"/>
<rect x="48" y="450" width="330" height="30" fill="#ECE5FF" stroke="none"/>
<rect x="48" y="520" width="330" height="30" fill="#ECE5FF" stroke="none"/>
<rect x="48" y="670" width="330" height="30" fill="#ECE5FF" stroke="none"/>
<rect data-child="A" x="48" y="350" width="150" height="100" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5"/>
<text data-label="A" x="58" y="375" style="fill:#c93030">A</text>
<rect data-child="B" x="228" y="350" width="150" height="100" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-label="B" x="238" y="375" style="fill:#315fa0">B</text>
<rect data-child="C" x="48" y="480" width="150" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-label="C" x="58" y="505" style="fill:#315fa0">C</text>
<rect data-child="D" x="228" y="480" width="150" height="40" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-label="D" x="238" y="505" style="fill:#315fa0">D</text>
<rect data-child="E" x="48" y="550" width="150" height="120" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-label="E" x="58" y="575" style="fill:#315fa0">E</text>
<rect data-child="F" x="228" y="550" width="150" height="120" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-label="F" x="238" y="575" style="fill:#315fa0">F</text>
<rect data-child="G" x="48" y="700" width="150" height="80" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-label="G" x="58" y="725" style="fill:#315fa0">G</text>
<rect data-child="H" x="228" y="700" width="150" height="80" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5"/>
<text data-label="H" x="238" y="725" style="fill:#315fa0">H</text>
<text x="398" y="380" class="small row">1行目：100px</text>
<text x="398" y="410" class="small">templateの1つ目</text>
<text x="398" y="496" class="small row">2行目：auto（40px）</text>
<text x="398" y="520" class="small">templateの2つ目</text>
<text x="398" y="578" class="small row">3行目：120px</text>
<text x="398" y="606" class="small">templateの3つ目</text>
<text x="398" y="728" class="small row">4行目：80px</text>
<text x="398" y="756" class="small">auto-rowsで追加</text>
<rect x="45.25" y="347.25" width="335.5" height="435.5" class="edge" data-parent-boundary="true" data-outline-offset="2.75" data-outline-gap="1"/>
<text x="24" y="820" class="small">親の内容高さ：100 + 40 + 120 + 80 + 30 × 3 = 430px</text>
</svg>
