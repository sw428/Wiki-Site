dth="330.0" height="30.0" /><rect class="gap-region" fill="#ECE5FF" stroke="none" x="48.0" y="394.0" width="330.0" height="30.0" /><rect data-child="A" x="48.0" y="184.0" width="150" height="90" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="58.41666667" y="210.78571429" class="">A</text><rect data-child="B" x="228.0" y="184.0" width="150" height="90" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="238.41666667" y="210.78571429" class="">B</text><rect data-child="C" x="48.0" y="304.0" width="150" height="90" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="58.41666667" y="330.78571429" class="">C</text><rect data-child="D" x="228.0" y="304.0" width="150" height="90" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="238.41666667" y="330.78571429" class="">D</text><rect data-child="E" x="48.0" y="424.0" width="150" height="90" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="58.41666667" y="450.78571429" class="">E</text><rect data-child="F" x="228.0" y="424.0" width="150" height="90" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="238.41666667" y="450.78571429" class="">F</text><text x="409.03448276" y="466.85714286" class="small row">追加された3行目</text><text x="24" y="552.0" class="small">左から右へ使い、足りなければ次の行へ。</text><rect x="45.25" y="181.25" width="515.5" height="335.5" fill="none" class="edge" data-parent-boundary="true" data-outline-offset="2.75" data-outline-gap="1" /><g class="parent-note-block" data-layout-shift="24"><text x="400" y="65" class="parent-note">※ 灰色の線はborderではなく、</text><text x="400" y="83" class="parent-note">親の範囲を示す補助線です。</text></g></svg>
