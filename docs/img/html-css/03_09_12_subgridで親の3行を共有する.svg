<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588.0" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto"><title id="title">subgridで親の3行を共有する</title><desc id="desc">親Gridの2列にcardを置き、各cardが3行分を使う。grid-template-rows:subgridによって親の行線を共有し、見出し・本文・操作の行位置が両方でそろう。図の行高は模式表示。</desc><style>text{font-family:Meiryo,"Yu Gothic",sans-serif;font-size:20px;font-weight:500;fill:#000000}.title{font-size:23px;font-weight:700;fill:#000000}.code{font-family:Consolas,Meiryo,monospace;font-size:18px;fill:#313539}.small{font-size:18px}.parent-label{fill:#444444}.column{fill:#007F99}.row{fill:#D66A00}.gap{fill:#7C3AED}.status{fill:#000000}.track{fill:none;stroke:#007F99;stroke-width:1.5}.edge{stroke:#666666;stroke-width:2;stroke-opacity:1;stroke-dasharray:none}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}.code .active-css{fill:#c93030}.gap-region{fill:#ECE5FF;stroke:none}.parent-note{font-size:12px;fill:#000000}</style><rect width="640" height="588.0" fill="#ffffff" /><text x="24" y="34" class="title">親の行を、入れ子のGridでも共有する</text><text x="24" y="96.0" class="code">.card {</text><text x="24" y="121.0" class="code">  display: grid; grid-row: span 3;</text><text x="24" y="146.0" class="code">  <tspan class="active-css">grid-template-rows: subgrid;</tspan></text><text x="24" y="171.0" class="code">}</text><text x="48" y="226.0" class="small parent-label">親の3行を、両方のcardで共有する</text><rect x="48.0" y="248.0" width="330.0" height="270.0" fill="#f5f5f5" /><rect class="gap-region" fill="#ECE5FF" stroke="none" x="198.0" y="248.0" width="30.0" height="270.0" /><rect class="gap-region" fill="#ECE5FF" stroke="none" x="48.0" y="328.0" width="330.0" height="30.0" /><rect class="gap-region" fill="#ECE5FF" stroke="none" x="48.0" y="448.0" width="330.0" height="30.0" /><rect x="48.0" y="248.0" width="150.0" height="80.0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="58.41666667" y="275.77777778" class="small">見出し</text><rect x="228.0" y="248.0" width="150.0" height="80.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="238.41666667" y="275.77777778" class="small">見出し</text><line x1="48.0" y1="248.0" x2="378.0" y2="248.0" stroke="#D66A00" stroke-width="1.5" stroke-dasharray="4 4" /><text x="398.0" y="279.11111111" class="small row">親の1行目</text><rect x="48.0" y="358.0" width="150.0" height="90.0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="58.41666667" y="384.78571429" class="small">本文</text><rect x="228.0" y="358.0" width="150.0" height="90.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="238.41666667" y="384.78571429" class="small">本文</text><line x1="48.0" y1="358.0" x2="378.0" y2="358.0" stroke="#D66A00" stroke-width="1.5" stroke-dasharray="4 4" /><text x="398.0" y="388.0" class="small row">親の2行目</text><rect x="48.0" y="478.0" width="150.0" height="40.0" fill="#f8cfd6" stroke="#c93030" stroke-width="1.5" /><text x="58.41666667" y="505.77777778" class="small">操作</text><rect x="228.0" y="478.0" width="150.0" height="40.0" fill="#cfe4ff" stroke="#315fa0" stroke-width="1.5" /><text x="238.41666667" y="505.77777778" class="small">操作</text><line x1="48.0" y1="478.0" x2="378.0" y2="478.0" stroke="#D66A00" stroke-width="1.5" stroke-dasharray="4 4" /><text x="398.0" y="509.11111111" class="small row">親の3行目</text><text x="24" y="558.0" class="small">各行の高さは模式表示。別々の行定義を作らない。</text><rect x="45.25" y="245.25" width="335.5" height="275.5" fill="none" class="edge" data-parent-boundary="true" data-outline-offset="2.75" data-outline-gap="1" /><g class="parent-note-block" data-layout-shift="24"><text x="400" y="65" class="parent-note">※ 灰色の線はborderではなく、</text><text x="400" y="83" class="parent-note">親の範囲を示す補助線です。</text></g></svg>
