<svg xmlns="http://www.w3.org/2000/svg" width="390.33" height="600" viewBox="0 -60 700 1076" preserveAspectRatio="xMidYMin meet" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">子Bの上下の負のmarginで子Bは40px、子C・Dは80px上へ詰まる</title>
<desc id="desc">通常フローで各兄弟の高さは100px、ほかの上下marginは0。子Bのmargin-top: -40pxで、B・C・Dとそれぞれの子が40px上へ動く。続いて子Bのmargin-bottom: -40pxで、後続のC・Dとそれぞれの子がさらに40px上へ動く。下marginの表記が上へ移る様子と、後続が上へ動く様子を順に示す。最終的にBは40px、C・Dは80px上へ動く。灰色の実線は親の範囲と要素の重なりを示し、実際のCSSのborderではない。説明用のアニメーションで、CSS処理がこの順に逐次実行されることを示すものではない。31.5秒周期。説明の切り替えでは0.25秒の空白後に0.25秒で文字を表示し、2.5秒以上待ってから3秒で動く。動きを減らす設定では最終状態を示す。親の塗りと外枠は内容に合わせて高さが縮み、点線の起点と間隔は保つ。横幅と子の寸法は模式的に示す。タイトル直下のCSSは対象と指定を示す。</desc>
<rect x="0" y="0" width="700" height="1016" fill="#ffffff"/>
<g id="drawing" transform="translate(0 16)">


